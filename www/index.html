    if (!nombre) return errEn('Escribí qué es.');
    if (cant === null) return errEn('La cantidad es un número entre 1 y 9999.');
    const r = await ops.guardarItem({ id:f.dataset.id || null, clienteId:f.dataset.cli, nombre, cantidad:cant, condicion:$('#i-k').value, nota:$('#i-o').value.trim(), ingreso:$('#i-f').value || '' });
    if (r.error) return errEn(r.error);
    cerrar(); toast(f.dataset.id ? 'Ítem guardado' : 'Ítem agregado'); render();
  },
  async items(f){
    const lista = parsearItems($('#i-l').value);
    if (!lista.length) return errEn('Escribí al menos un ítem.');
    if (lista.length > 100) return errEn('Cargá hasta 100 ítems por vez.');
    const r = await ops.guardarItems(lista.map(x => ({ ...x, clienteId:f.dataset.cli, condicion:'Bueno', ingreso:hoyISO() }))); if (r.error) return errEn(r.error);
    cerrar(); toast(`${lista.length} ${lista.length === 1 ? 'ítem cargado' : 'ítems cargados'}`); render();
  },
  async cliente(f){
    const id = f.dataset.id, c = id ? usr(id) : null;
    const nombre = $('#k-n').value.trim(), tel = $('#k-t').value.trim(), usuario = $('#k-u').value.trim().toLowerCase(), pass = $('#k-p').value, ug = $('#k-g').value || null;
    if (nombre.length < 2) return errEn('Escribí el nombre del cliente.');
    if (!c) {
      if (!/^[a-z0-9._-]{3,}$/.test(usuario)) return errEn('El usuario necesita 3 letras o números como mínimo, sin espacios.');
      if (pass.length < MINPASS) return errEn(`La contraseña necesita ${MINPASS} caracteres como mínimo.`);
    } else if (pass && pass.length < MINPASS) return errEn(`La contraseña necesita ${MINPASS} caracteres como mínimo.`);
    const r = await ops.guardarCliente({ id:id || null, nombre, telefono:tel, usuario, pass, unidadId:ug });
    if (r.error) { errEn(r.error); return; }
    cerrar(); toast(c ? 'Cliente guardado' : `Cliente creado. Su código es ${r.codigo}.`); render();
  },
  async unidad(f){
    const id = f.dataset.id, nombre = $('#g-n').value.trim(), sede = $('#g-s').value.trim(), m2 = Number(String($('#g-m').value).replace(',', '.'));
    if (!nombre) return errEn('Escribí el nombre o número.');
    if (!sede) return errEn('Escribí el depósito.');
    if (!(m2 > 0)) return errEn('Escribí la superficie en m².');
    const r = await ops.guardarUnidad({ id:id || null, nombre, sede, m2 }); if (r.error) { errEn(r.error); return; }
    cerrar(); toast('Guardamueble guardado'); render();
  },
  async cfgDesc(){
    const a = entero($('#c-ref').value, 0, 100), b = entero($('#c-rid').value, 0, 100), t = entero($('#c-top').value, 0, 100), v = entero($('#c-ven').value, 0, 60);
    if (a === null || b === null || t === null) return errEn('Los porcentajes son números enteros entre 0 y 100.');
    if (v === null) return errEn('El vencimiento va de 0 a 60 meses (0 = no vencen).');
    const r = await ops.guardarConfig({ descReferente:a, descReferido:b, tope:t, vencReferidosMeses:v }); if (r.error) { errEn(r.error); return; }
    toast('Descuentos guardados'); render();
  },
  async cfgTurnos(){
    const cupo = entero($('#a-cupo').value, 1, 50), hs = entero($('#a-hs').value, 0, 72), ant = entero($('#a-ant').value, 1, 90);
    if (cupo === null) return errEn('El cupo es un número entre 1 y 50.');
    if (hs === null) return errEn('Las horas de cancelación van de 0 a 72.');
    if (ant === null) return errEn('Los días de anticipación van de 1 a 90.');
    const leerHoras = id => $(id).value.split(/[,\s;]+/).filter(Boolean).map(s => { const m = s.match(/^(\d{1,2}):(\d{2})$/); return m && +m[1] < 24 && +m[2] < 60 ? pad(+m[1]) + ':' + m[2] : null; });
    const fr = leerHoras('#a-fr'), fs = leerHoras('#a-fs');
    if (!fr.length || fr.includes(null)) return errEn('Los horarios de lunes a viernes van en formato 24 hs, por ejemplo 09:00, 10:00.');
    if (fs.includes(null)) return errEn('Los horarios de sábados van en formato 24 hs, por ejemplo 09:00, 10:00.');
    const dias = $$('input[name="dia"]:checked').map(i => +i.value);
    if (!dias.length) return errEn('Elegí al menos un día de atención.');
    if (!fs.length && (dias.includes(6) || dias.includes(0))) return errEn('Cargá los horarios de sábados o desactivá ese día.');
    const r = await ops.guardarConfig({ cupo, horasCancelar:hs, diasAnticipo:ant, franjas:[...new Set(fr)].sort(), franjasSab:[...new Set(fs)].sort(), dias }); if (r.error) { errEn(r.error); return; }
    toast('Turnos guardados'); render();
  },
  async cfgAvisos(){
    const rt = entero($('#a-rt').value, 1, 48), rm = entero($('#a-rm').value, 1, 48);
    if (rt === null || rm === null) return errEn('Las horas van de 1 a 48.', 'm-err3');
    const dias = $$('input[name="pdia"]:checked').map(i => +i.value);
    if (!dias.length) return errEn('Elegí al menos un día para las promociones.', 'm-err3');
    const r = await ops.guardarConfig({ recordarTurnoHs:rt, recordarMudanzaHs:rm, promoDias:dias }); if (r.error) { errEn(r.error, 'm-err3'); return; }
    toast('Avisos guardados'); render();
  },
  async cfgContacto(){
    const w = $('#a-wa').value.trim(); if (w && digits(w).length < 8) { toast('Escribí un número válido o dejalo vacío.'); return; }
    const r = await ops.guardarConfig({ whatsapp:w }); if (r.error) { errEn(r.error); return; }
    toast('Contacto guardado'); render();
  },
  async cfgPass(){      // dueño, desde Ajustes
    const r = await ops.cambiarClave($('#a-p0').value, $('#a-p1').value); if (r.error) return errEn(r.error, 'm-err2');
    $('#a-p0').value = ''; $('#a-p1').value = ''; toast('Contraseña cambiada');
  },
  async miClave(){      // cliente, desde Mi cuenta
    const r = await ops.cambiarClave($('#mc-p0').value, $('#mc-p1').value); if (r.error) return errEn(r.error);
    cerrar(); toast('Contraseña cambiada');
  },
  async eliminarCuenta(){
    const r = await ops.eliminarMiCuenta($('#mc-del').value); if (r.error) return errEn(r.error);
    S.user = null; DB = NUBE ? baseVacia() : DB; cerrar(); render(); window.scrollTo(0, 0);
    if (NUBE) cargarPublico().then(() => { if (!S.user) render(); });
    toast('Tu cuenta se eliminó. ¡Gracias por haber usado PG Logística!');
  }
};
document.addEventListener('submit', async e => {
  e.preventDefault();
  const n = e.target.dataset.form, h = FORMS[n]; if (!h) return;
  if (SOLO_DUENO_F.has(n) && !esDueno()) return;
  if (n === 'cfgPass' && !esDueno()) return;
  if (n === 'registro' && S.user) return;
  if (['miClave','eliminarCuenta'].includes(n) && (!S.user || esDueno())) return;
  await corre(() => h(e.target));
});

/* ---------- arranque ---------- */
(async function init(){
  const t = ls.get(KT); if (t) aplicarTema(t);
  if (NUBE) {
    PUSH.escuchar();                      // para enterarse si la app se abrió tocando una notificación
    DB = baseVacia();
    $('#app').innerHTML = '<div class="boot" role="status">Cargando…</div>';
    const r = await ops.restaurar();
    if (r && r.rol) S.view = r.rol === 'dueno' ? 'resumen' : 'inicio';
    else { const ok = await ops.cargarPublico(); if (r && r.error) toast(r.error); else if (!ok) toast('No hay conexión. Revisá tu internet.'); }
  } else {
    DB = load();
    if (!DB) { DB = await crearBase(true); save(); }
    const u = await ops.restaurar(); if (u) S.view = u.rol === 'dueno' ? 'resumen' : 'inicio';
  }
  render();
})();
})();
</script>
