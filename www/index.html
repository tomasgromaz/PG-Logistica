/* Concepto: app de depósito. Blancos con tinte azul, azul eléctrico como único acento,
   tipografía de rótulo de cajas (display) y lectura clara (cuerpo). Móvil primero, barra inferior. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;

  --bg:#f2f6fd;
  --surface:#ffffff;
  --surface-2:#e9f0fb;
  --line:#d8e2f2;
  --fg:#0a1a35;
  --fg-2:#3f526e;
  --fg-3:#5f7089;
  --accent:#1456d9;
  --accent-hover:#0f46b3;
  --on-accent:#ffffff;
  --accent-soft:#e1ebfd;
  --accent-ink:#0d3d9e;
  --ok:#0b7650; --ok-soft:#dbf2e7;
  --warn:#8a4f00; --warn-soft:#fbeed0;
  --bad:#b0232e; --bad-soft:#fde4e6; --on-bad:#ffffff;
  --hero-a:#0f43b0; --hero-b:#2271f2;
  --scrim:rgba(6,16,36,.55);
  --shadow:0 1px 2px rgba(10,30,70,.06),0 10px 28px rgba(10,30,70,.07);
  --logo-bg:transparent; --logo-pad:0px;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06101f; --surface:#0d1a30; --surface-2:#142540; --line:#223652;
    --fg:#e8eefb; --fg-2:#a9b8d0; --fg-3:#8496b3;
    --accent:#5a9bff; --accent-hover:#7bb0ff; --on-accent:#05122a; --accent-soft:#12305f; --accent-ink:#b3d0ff;
    --ok:#4cd39b; --ok-soft:#0f3a2c; --warn:#f2b55c; --warn-soft:#3a2b0f; --bad:#ff8189; --bad-soft:#401a21; --on-bad:#3b0a10;
    --hero-a:#0b2a63; --hero-b:#1650b5;
    --scrim:rgba(0,0,0,.65);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --logo-bg:#ffffff; --logo-pad:4px;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06101f; --surface:#0d1a30; --surface-2:#142540; --line:#223652;
  --fg:#e8eefb; --fg-2:#a9b8d0; --fg-3:#8496b3;
  --accent:#5a9bff; --accent-hover:#7bb0ff; --on-accent:#05122a; --accent-soft:#12305f; --accent-ink:#b3d0ff;
  --ok:#4cd39b; --ok-soft:#0f3a2c; --warn:#f2b55c; --warn-soft:#3a2b0f; --bad:#ff8189; --bad-soft:#401a21; --on-bad:#3b0a10;
  --hero-a:#0b2a63; --hero-b:#1650b5;
  --scrim:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --logo-bg:#ffffff; --logo-pad:4px;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.grow{flex:1;min-width:0}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- marca ---------- */
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand .mark{display:block;flex:none;height:44px;border-radius:10px;background:var(--logo-bg);padding:var(--logo-pad)}
.brand .mark img{display:block;height:100%;width:auto}
.brand .word{font-weight:500}

/* ---------- botones y formularios ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--surface-2);color:var(--fg);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.sec{background:var(--surface);border-color:var(--line)}
.btn.sec:hover{background:var(--surface-2)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.good{background:var(--ok-soft);color:var(--ok)}
.btn.white{background:#fff;color:#0d3d9e}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}

.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:13px;color:var(--fg-2)}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--font-body)}
textarea.in{min-height:88px;resize:vertical}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.in::placeholder{color:var(--fg-3)}
.hint{font-size:13px;color:var(--fg-3)}
.msg{font-size:13px;font-weight:600;border-radius:10px;padding:8px 10px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.boot{display:grid;place-items:center;min-height:60vh;color:var(--fg-3);font-weight:600}
html.busy,html.busy *{cursor:progress!important}
html.busy .btn{opacity:.7;pointer-events:none}
.form{display:grid;gap:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-top:4px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;background:var(--surface)}
.checks input{accent-color:var(--accent)}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.login-hero{background:linear-gradient(140deg,var(--hero-a),var(--hero-b));color:#fff;padding-top:28px;padding-bottom:32px;display:grid;gap:18px;align-content:start;position:relative;overflow:hidden}
.login-hero::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 56px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 56px);pointer-events:none}
.login-hero>*{position:relative;z-index:1}
.login-hero .brand .mark{height:68px;border-radius:16px;background:#fff;padding:7px}
.login-hero h1{font:700 clamp(28px,6vw,44px)/1.08 var(--font-display);letter-spacing:-.02em;text-wrap:balance;max-width:16ch}
.login-hero p{max-width:44ch;color:rgba(255,255,255,.9)}
.hero-points{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-weight:600;font-size:14px}
.hero-points li{display:flex;gap:10px;align-items:center}
.hero-points .ic{width:18px;height:18px}
.login-card{padding-top:24px;padding-bottom:40px;display:grid;gap:16px;align-content:start;background:var(--bg)}
.login-card h2{font:700 24px/1.2 var(--font-display)}
.sep{display:flex;align-items:center;gap:12px;color:var(--fg-3);font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.demo{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;background:var(--surface)}
.demo summary{cursor:pointer;font-weight:600;color:var(--fg-2)}
.demo .demo-list{display:grid;gap:6px;margin-top:10px}
.demo button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left}
.demo button span:last-child{color:var(--fg-3);font-variant-numeric:tabular-nums}
@media (min-width:900px){
  .login{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:100vh}
  .login-hero{padding:48px 56px;align-content:center}
  .login-card{padding:48px 56px;align-content:center;max-width:520px}
}

/* ---------- estructura ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;height:60px;max-width:1240px;margin:0 auto}
.top-in .brand{margin-right:auto}
.who{display:none;font-size:14px;color:var(--fg-2);font-weight:600}
.layout{max-width:1240px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;max-width:640px;margin:0 auto;padding-left:max(2px,env(safe-area-inset-left,0px));padding-right:max(2px,env(safe-area-inset-right,0px))}
.nav button{flex:1;min-width:0;display:grid;justify-items:center;gap:2px;padding:9px 1px 8px;border:0;background:none;color:var(--fg-3);font-size:10px;letter-spacing:-.01em;font-weight:600;cursor:pointer;border-radius:10px}
.nav button .ic{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .sh{display:none}
@media (max-width:420px){.nav .lg{display:none}.nav .sh{display:block}}
.main{padding-top:20px;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));min-width:0}
.main>*+*{margin-top:18px}
@media (min-width:900px){
  .who{display:block}
  .layout{display:grid;grid-template-columns:216px minmax(0,1fr);gap:32px;align-items:start}
  .nav{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));border:0;background:none;padding:0}
  .nav-in{display:grid;gap:4px;max-width:none;padding:0}
  .nav button{display:flex;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;font-size:15px;letter-spacing:0;color:var(--fg-2)}
  .nav button:hover{background:var(--surface-2)}
  .nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
  .main{padding-top:28px;padding-bottom:64px}
}

/* ---------- tipografía de contenido ---------- */
.h1{font:700 clamp(26px,5vw,34px)/1.1 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.h2{font:700 19px/1.2 var(--font-display);letter-spacing:-.01em}
.sub{color:var(--fg-2)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead .sub{margin-top:4px}

/* ---------- tarjetas y listas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card>.h2+*{margin-top:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.kpi b{font:700 32px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--fg-2);font-weight:600}
.kpi.hot{background:var(--accent-soft);border-color:transparent}
.kpi.hot b{color:var(--accent-ink)}
.list{list-style:none;margin:0;padding:0}
.list>li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;align-items:center;padding:14px 16px;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit}
.row .side{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
button.row{cursor:pointer}
button.row:hover{background:var(--surface-2)}
@media (min-width:720px){
  .row{grid-template-columns:auto minmax(0,1fr) auto}
  .row .side{grid-column:auto}
}
.compact .row{grid-template-columns:auto minmax(0,1fr)}
.compact .row .side{grid-column:1/-1}
.t-main{font-weight:700;overflow-wrap:anywhere}
.t-sub{font-size:14px;color:var(--fg-2);overflow-wrap:anywhere}
.t-note{font-size:13px;color:var(--fg-3);margin-top:2px;overflow-wrap:anywhere}
.dt{width:56px;text-align:center;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);padding:6px 0;line-height:1.1}
.dt small{display:block;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:700}
.dt b{display:block;font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.dt.off{background:var(--surface-2);color:var(--fg-3)}
.day-h{padding:10px 16px;background:var(--surface-2);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.empty{padding:28px 16px;text-align:center;color:var(--fg-2);display:grid;gap:10px;justify-items:center}
.empty b{font-family:var(--font-display);font-size:17px;color:var(--fg)}

.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.acc{background:var(--accent-soft);color:var(--accent-ink)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-variant-numeric:tabular-nums}

.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--fg-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ---------- inicio del cliente ---------- */
.hero-card{border-radius:20px;padding:22px;color:#fff;background:linear-gradient(140deg,var(--hero-a),var(--hero-b));position:relative;overflow:hidden;box-shadow:var(--shadow);display:grid;gap:6px}
.hero-card::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 48px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 48px);pointer-events:none}
.hero-card>*{position:relative;z-index:1}
.hero-card .eyebrow{color:rgba(255,255,255,.8)}
.hero-card .big{font:700 clamp(44px,12vw,64px)/1 var(--font-display);letter-spacing:-.03em}
.hero-card .meta{color:rgba(255,255,255,.92);font-weight:500}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.big-credit{font:700 40px/1 var(--font-display);letter-spacing:-.02em;color:var(--accent)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* ---------- referidos ---------- */
.code-card{border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.code-card .code{font:700 clamp(28px,8vw,40px)/1 var(--font-display);letter-spacing:.06em;color:var(--accent-ink);overflow-wrap:anywhere}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);font:700 16px var(--font-display)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:10px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}

/* ---------- guardamuebles ---------- */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.unit .nm{font:700 28px/1 var(--font-display);letter-spacing:-.02em}
.unit.free{background:transparent;border-style:dashed}
.unit .who2{font-size:14px;color:var(--fg-2);overflow-wrap:anywhere}
.unit .ops{display:flex;gap:8px;flex-wrap:wrap}
.sede-h{display:flex;align-items:center;gap:8px;margin-top:6px}

/* ---------- turnos: selección ---------- */
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.chip-d{flex:none;scroll-snap-align:start;width:62px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;justify-items:center;line-height:1.15}
.chip-d small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3)}
.chip-d b{font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.chip-d[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip-d[aria-pressed="true"] small{color:inherit;opacity:.85}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:600 15px var(--font-body);font-variant-numeric:tabular-nums;cursor:pointer;display:grid;align-content:center;justify-items:center;line-height:1.15}
.slot small{font-size:11px;font-weight:600;color:var(--fg-3)}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.slot[disabled]{background:var(--surface-2);color:var(--fg-3);cursor:not-allowed;text-decoration:line-through;text-decoration-thickness:1px}
.slot[disabled] small{text-decoration:none}

/* ---------- presupuestos ---------- */
.dl{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
.dl dt{color:var(--fg-3);font-weight:600}
.dl dd{margin:0;overflow-wrap:anywhere}
.sum{display:grid;gap:6px;font-size:15px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .disc{color:var(--ok);font-weight:600}
.sum .total{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font:700 22px var(--font-display)}
.panel{background:var(--surface-2);border-radius:12px;padding:14px;display:grid;gap:10px}

/* ---------- modal y aviso ---------- */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:580px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-h .h2{font-size:21px;padding-top:6px}
.sheet .stack{display:grid;gap:14px}
@media (min-width:720px){
  .ov{align-items:center;padding:24px}
  .sheet{border-radius:20px;padding:22px 24px}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,460px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (min-width:900px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* ---------- avisos, preferencias y descuentos ---------- */
.icon-btn.bell{position:relative}
.dot{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--on-bad);font:700 11px/15px var(--font-body);text-align:center;font-variant-numeric:tabular-nums;border:2px solid var(--surface)}
.row.aviso{align-items:start;grid-template-columns:auto minmax(0,1fr)}
.row.aviso.nuevo{background:var(--accent-soft)}
.row.aviso.nuevo:hover{background:var(--accent-soft)}
.av-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.aviso.nuevo .av-ic{background:var(--surface)}
.sw{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.sw input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:none}
.sw-t{display:grid;gap:2px;min-width:0}
.sw-t small{color:var(--fg-3);font-size:13px;line-height:1.35}
.sw-group{margin-top:14px}

async function hash(usuario, pass){
  const s = 'pg|' + String(usuario).toLowerCase() + '|' + pass;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  } catch(e){
    let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0;
    return 'x' + (h >>> 0).toString(16);
  }
}

    A('u-maria','turno','Turno confirmado','Te esperamos el '+ddmm(abierto(1))+' a las 10:00 hs · Retirar cosas','turno',20,true),

/* ---------- acceso a datos ---------- */

  : DB.presupuestos.filter(p => p.codigoRefId === id).map(p => ({ num:p.num, nombre:p.nombre, servicio:p.servicio, estado:p.estado, creado:p.creado })).sort((a,b) => b.creado - a.creado);
const itemsDe = id => DB.inventario.filter(i => i.clienteId === id).sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));

/* ---------- estado de la interfaz ---------- */
const S = { user:null, view:null, pub:null, filtroT:'proximos', filtroP:'todos', filtroU:'', invCli:null, qInv:'', sinLeer:null };

const misPres = () => DB.presupuestos.filter(p => esDueno() || p.clienteId === S.user.id);
const misAvisos = () => DB.avisos.filter(a => S.user && a.usuarioId === S.user.id).sort((a,b) => b.creado - a.creado);
const avisosSinLeer = () => misAvisos().filter(a => !a.leido).length;
const activo = t => t.estado === 'pendiente' || t.estado === 'confirmado';
const futuro = t => dtTurno(t.fecha, t.hora) > new Date();
const porFecha = (a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora);

/* ---------- reglas de turnos ---------- */
function slotInfo(fecha, hora){
  // en la nube cada cliente ve cuántos lugares hay ocupados, sin ver de quién son los turnos
  const ocupados = NUBE ? (DB.ocup[fecha + '|' + hora] || 0) : DB.turnos.filter(t => t.fecha === fecha && t.hora === hora && activo(t)).length;
  return { libre: DB.config.cupo - ocupados, pasado: dtTurno(fecha, hora) <= new Date() };
}
// Lunes a viernes tienen sus horarios y el sábado (y el domingo, si se habilita) los suyos
const franjasDe = fecha => { const d = parseISO(fecha).getDay(); return ((d === 0 || d === 6) ? DB.config.franjasSab : DB.config.franjas) || []; };
function diasDisponibles(){
  const out = []; const h = new Date(); h.setHours(0,0,0,0);
  for (let i = 0; i <= DB.config.diasAnticipo; i++) {
    const d = addDays(h, i);
    if (DB.config.dias.includes(d.getDay())) out.push(isoDate(d));
  }
  return out;
}
function crearTurno({ clienteId, fecha, hora, motivo, nota, estado }){
  const u = usr(clienteId);
  if (!u || !u.unidadId) return { error:'Este cliente no tiene un guardamueble asignado.' };
  if (!fecha || !hora) return { error:'Elegí un día y un horario.' };
  if (!franjasDe(fecha).includes(hora)) return { error:'Ese horario no está disponible.' };
  if (!DB.config.dias.includes(parseISO(fecha).getDay())) return { error:'Ese día no se atiende.' };
  const si = slotInfo(fecha, hora);
  if (si.pasado) return { error:'Ese horario ya pasó.' };
  if (si.libre <= 0) return { error:'Ese horario se completó. Elegí otro.' };
  const act = DB.turnos.filter(t => t.clienteId === clienteId && activo(t) && futuro(t));
  if (act.length >= 3) return { error:'Ya hay 3 turnos activos. Hay que cancelar uno para pedir otro.' };
  if (act.some(t => t.fecha === fecha)) return { error:'Ya hay un turno para ese día.' };
  const t = { id:uid(), clienteId, unidadId:u.unidadId, fecha, hora, motivo, nota:nota||'', estado, creado:Date.now() };
  DB.turnos.push(t); avisosTurno(t, null); save();
  return { ok:t };
}
function cancelarTurno(id, porDueno){
  const t = turno(id);
  if (!t || !activo(t)) return { error:'Este turno ya no se puede cancelar.' };
  if (!porDueno) {
    const hs = (dtTurno(t.fecha, t.hora) - new Date()) / 36e5;
    if (hs < DB.config.horasCancelar) return { error:`Se puede cancelar hasta ${DB.config.horasCancelar} hs antes. Avisanos por WhatsApp.` };
  }
  const antes = t.estado;
  t.estado = 'cancelado'; t.canceladoPor = porDueno ? 'dueno' : 'cliente'; avisosTurno(t, antes); save();
  return { ok:true };
}

/* =====================================================================
   Descuentos. En la nube los aplica el servidor al confirmar el presupuesto;
   acá solo se muestran y se calculan los totales. Tres tipos que se suman:
   · código de referido (5% al referido en su primera mudanza)
   · descuentos por referidos (3% por cada referido que contrató, hasta el tope; uso único)
   · descuento del mes (2 a 5%, en mudanzas o en guardamuebles; uso único; vence a fin de mes)
   ===================================================================== */
const tipoMensual = servicio => servicio === 'Mudanza' ? 'mudanza' : servicio === 'Guardamuebles (nuevo)' ? 'guardamuebles' : null;
const TIPO_TXT = { mudanza:'mudanzas', guardamuebles:'guardamuebles' };
const mensualDe = (id, mes = mesActualISO()) => DB.mensuales.find(m => m.clienteId === id && m.mes === mes);
// 'disponible' del mes pasado ya no sirve: se muestra como vencido
const estadoMensual = m => (m.estado === 'disponible' && m.mes < mesActualISO()) ? 'vencido' : m.estado;
const vigenteC = c => c.estado === 'disponible' && (!c.venceEn || c.venceEn >= hoyISO());
const estadoCredito = c => (c.estado === 'disponible' && !vigenteC(c)) ? 'vencido' : c.estado;
const creditoLibre = id => DB.creditos.filter(c => c.clienteId === id && vigenteC(c)).reduce((s, c) => s + c.pct, 0);
const creditoActivo = id => DB.creditos.filter(c => c.clienteId === id && (c.estado === 'reservado' || vigenteC(c))).reduce((s, c) => s + c.pct, 0);
const dctoDe = (monto, pct) => Math.round(monto * pct / 100);
const dPres = p => ({ ref:p.descRef || 0, cred:p.descCred || 0, men:p.descMensual || 0 });
// Desglose de un precio con sus descuentos (todos los porcentajes se calculan sobre el precio base)
function calc(monto, d){
  const filas = [];
  if (d.ref) filas.push({ txt:`Código de referido (${d.ref}%)`, pct:d.ref, imp:dctoDe(monto, d.ref) });
  if (d.cred) filas.push({ txt:`Descuento por referidos (${d.cred}%)`, pct:d.cred, imp:dctoDe(monto, d.cred) });
  if (d.men) filas.push({ txt:`Descuento del mes (${d.men}%)`, pct:d.men, imp:dctoDe(monto, d.men) });
  const ahorro = filas.reduce((s, f) => s + f.imp, 0), pct = filas.reduce((s, f) => s + f.pct, 0);
  return { filas, pct, ahorro, total:monto - ahorro };
}
const totalPres = p => p.monto > 0 ? calc(p.monto, dPres(p)).total : 0;
// Qué descuentos se le aplicarían a un pedido si se confirma ahora (para la vista previa del dueño)
function previsionDescuentos(p){
  const cfg = DB.config, hoy = hoyISO(), mes = mesActualISO();
  let cred = 0, men = 0, sinSorteo = false;
  if (p.clienteId) {
    if (p.servicio === 'Mudanza') {
      const pool = DB.creditos.filter(c => c.clienteId === p.clienteId && (vigenteC(c) || (c.estado === 'reservado' && c.presupuestoId === p.id))).sort((a, b) => a.creado - b.creado);
      for (const c of pool) { if (cred + c.pct > cfg.tope) break; cred += c.pct; }
    }
    const tipo = tipoMensual(p.servicio);
    if (tipo) {
      const m = DB.mensuales.find(x => x.presupuestoId === p.id && x.estado === 'reservado')
             || DB.mensuales.find(x => x.clienteId === p.clienteId && x.mes === mes && x.tipo === tipo && x.estado === 'disponible');
      if (m) men = m.pct; else if (!mensualDe(p.clienteId)) sinSorteo = true;
    }
  }
  return { ref: p.codigoRefId ? cfg.descReferido : 0, cred, men, sinSorteo };
}
// Registro de descuentos de un cliente (del mes y por referidos), del más nuevo al más viejo
function registroDe(id){
  const filas = [];
  DB.mensuales.filter(m => m.clienteId === id).forEach(m => {
    const e = estadoMensual(m);
    filas.push({ clave:'m' + m.id, titulo:`Del mes · ${cap(fmtMes(m.mes))}`, sub:`${m.pct}% en ${TIPO_TXT[m.tipo]}`, pct:m.pct, estado:e, orden:parseISO(m.mes).getTime(),
      fecha: e === 'usado' && m.usadoEn ? `Usado el ${fmtMs(m.usadoEn)}` : e === 'vencido' ? `Venció el ${ddmm(finDeMes(m.mes))}` : `Vence el ${ddmm(finDeMes(m.mes))}`, presId:m.presupuestoId });
  });
  DB.creditos.filter(c => c.clienteId === id).forEach(c => {
    const e = estadoCredito(c);
    filas.push({ clave:'c' + c.id, titulo:'Por referido', sub:`${c.pct}% en mudanzas`, pct:c.pct, estado:e, orden:c.creado,
      fecha: e === 'usado' && c.usadoEn ? `Usado el ${fmtMs(c.usadoEn)}` : e === 'vencido' ? `Venció el ${ddmm(c.venceEn)}` : c.venceEn ? `Vence el ${ddmm(c.venceEn)}` : 'Sin vencimiento', presId:c.presupuestoId });
  });
  return filas.sort((a, b) => b.orden - a.orden);
}

/* ---------- avisos (en modo demo los genera esta app; en la nube, el servidor) ---------- */
const sectorDe = servicio => servicio === 'Guardamuebles (nuevo)' ? 'gm' : 'mud';
const diaTxt = iso => iso === hoyISO() ? 'Hoy' : iso === isoDate(addDays(new Date(), 1)) ? 'Mañana' : 'El ' + ddmm(iso);
function aviso(para, tipo, titulo, cuerpo, refTipo, refId, clave){
  if (!para || !usr(para)) return;
  if (clave && DB.avisos.some(a => a.usuarioId === para && a.clave === clave)) return;
  DB.avisos.push({ id:uid(), usuarioId:para, tipo, titulo, cuerpo:cuerpo || '', refTipo:refTipo || null, refId:refId || null, clave:clave || null, creado:Date.now(), leido:null });
}
function avisoDueno(sector, cat, tipo, titulo, cuerpo, refTipo, refId, clave){

function avisosTurno(t, antes){            // antes: estado anterior (null si el turno es nuevo)
  const c = usr(t.clienteId), cuando = `${ddmm(t.fecha)} a las ${t.hora} hs`, quien = iniciales(c && c.nombre) || 'Un cliente';
  if (antes === null) {

    else if (t.estado === 'cancelado' && t.canceladoPor === 'dueno') aviso(t.clienteId, 'turno', 'Turno cancelado', `Cancelamos tu turno del ${cuando}. Pedí uno nuevo cuando quieras.`, 'turno', t.id);

}
function avisosPres(p, antes, montoCambio, porDueno){

  else if (p.estado === 'aceptado' && !porDueno) avisoDueno(sec, 'nuevos', 'presupuesto_aceptado', 'Aceptaron un presupuesto', `${num} · ${p.servicio} · ${quien}`, 'presupuesto', p.id);
  else if (p.estado === 'rechazado' && !porDueno) avisoDueno(sec, 'nuevos', 'presupuesto_rechazado', 'Rechazaron un presupuesto', `${num} · ${p.servicio} · ${quien}`, 'presupuesto', p.id);
  else if (p.estado === 'rechazado') aviso(p.clienteId, 'presupuesto', 'Cerramos tu pedido', `${num} · ${p.servicio}. Escribinos si querés que lo revisemos.`, 'presupuesto', p.id);

/* ---------- descuentos y estados de presupuestos (modo demo) ---------- */
function asegurarDescuento(id){
  const c = usr(id); if (!c || c.rol !== 'cliente') return null;
  const mes = mesActualISO();
  let m = mensualDe(id, mes); if (m) return m;
  m = { id:uid(), clienteId:id, mes, tipo:Math.random() < .5 ? 'mudanza' : 'guardamuebles', pct:2 + Math.floor(Math.random() * 4), estado:'disponible', presupuestoId:null, usadoEn:null, creado:Date.now() };
  DB.mensuales.push(m);
  if ((c.avisos || {}).promos !== false)
    aviso(id, 'promo_mensual', `Tu descuento de ${fmtMes(mes)}`, `Tenés ${m.pct}% de descuento en ${m.tipo === 'mudanza' ? 'tu próxima mudanza' : 'guardamuebles'} hasta el ${ddmm(finDeMes(mes))}. Se aplica solo cuando confirmemos tu presupuesto.`, 'descuentos', null, 'mes-' + mes.slice(0, 7));
  return m;
}
function confirmarLocal(p, monto, nota, hora){
  const cfg = DB.config, ref = p.codigoRefId ? cfg.descReferido : 0; let cred = 0, men = 0;
  if (p.clienteId) {
    DB.creditos.forEach(c => { if (c.presupuestoId === p.id && c.estado === 'reservado') { c.estado = 'disponible'; c.presupuestoId = null; } });
    if (p.servicio === 'Mudanza') {
      for (const c of DB.creditos.filter(c => c.clienteId === p.clienteId && vigenteC(c)).sort((a, b) => a.creado - b.creado)) {
        if (cred + c.pct > cfg.tope) break;
        cred += c.pct; c.estado = 'reservado'; c.presupuestoId = p.id;
      }
    }
    const tipo = tipoMensual(p.servicio);
    if (tipo) {
      let m = DB.mensuales.find(x => x.presupuestoId === p.id && x.estado === 'reservado');
      if (!m) {
        asegurarDescuento(p.clienteId);
        m = DB.mensuales.find(x => x.clienteId === p.clienteId && x.mes === mesActualISO() && x.tipo === tipo && x.estado === 'disponible');
        if (m) { m.estado = 'reservado'; m.presupuestoId = p.id; }
      }
      if (m) men = m.pct;
    }
  }
  const antes = p.estado, montoAntes = p.monto;
  Object.assign(p, { monto, descRef:ref, descCred:cred, descMensual:men, hora:hora || '', nota, estado:'cotizado' });
  avisosPres(p, antes, montoAntes !== monto, true);
  save();
}
// Cambia el estado de un presupuesto y reparte lo que corresponde: descuentos que vuelven o quedan usados, y avisos
function setEstadoPres(p, nuevo, porDueno){
  const antes = p.estado; p.estado = nuevo;
  if (nuevo === 'rechazado' || nuevo === 'cancelado') {
    DB.mensuales.forEach(m => { if (m.presupuestoId === p.id && m.estado === 'reservado') { m.estado = 'disponible'; m.presupuestoId = null; } });
    DB.creditos.forEach(c => { if (c.presupuestoId === p.id && c.estado === 'reservado') { c.estado = c.venceEn && c.venceEn < hoyISO() ? 'vencido' : 'disponible'; c.presupuestoId = null; } });
  } else if (nuevo === 'realizado') {
    DB.mensuales.forEach(m => { if (m.presupuestoId === p.id && m.estado === 'reservado') { m.estado = 'usado'; m.usadoEn = Date.now(); } });
    DB.creditos.forEach(c => { if (c.presupuestoId === p.id && c.estado === 'reservado') { c.estado = 'usado'; c.usadoEn = Date.now(); } });
  }
  avisosPres(p, antes, false, porDueno);
}
function realizarLocal(p){
  const cfg = DB.config, yaRecompensado = p.recompensado; let out = { referente:null, suma:0 };
  p.recompensado = p.recompensado || !!p.codigoRefId;
  setEstadoPres(p, 'realizado', true);
  if (p.codigoRefId && !yaRecompensado) {
    const rf = usr(p.codigoRefId);
    if (rf) {
      const antes = creditoActivo(rf.id), suma = Math.min(cfg.descReferente, Math.max(0, cfg.tope - antes));
      if (suma > 0) {
        const v = new Date(); v.setMonth(v.getMonth() + cfg.vencReferidosMeses);
        DB.creditos.push({ id:uid(), clienteId:rf.id, pct:suma, origenId:p.id, estado:'disponible', presupuestoId:null, venceEn: cfg.vencReferidosMeses > 0 ? isoDate(v) : null, usadoEn:null, creado:Date.now() });
      }
      aviso(rf.id, 'referido', suma > 0 ? `¡Sumaste ${suma}% de descuento!` : 'Tu referido contrató',
        suma > 0 ? `Tu referido contrató con tu código. Ahora tenés ${antes + suma}% para tu próxima mudanza.` : `Tu referido contrató con tu código. Ya llegaste al máximo de ${cfg.tope}%.`, 'descuentos');
      out = { referente:rf.nombre, suma };

}
function vencerCreditos(){ DB.creditos.forEach(c => { if (c.estado === 'disponible' && c.venceEn && c.venceEn < hoyISO()) c.estado = 'vencido'; }); }

/* Recordatorios y promociones. En la nube corren solos en el servidor (cada 15 minutos y una vez al día). */
function generarRecordatorios(){
  const ahora = new Date(), cfg = DB.config, n0 = DB.avisos.length;
  DB.turnos.filter(t => t.estado === 'confirmado').forEach(t => {
    const f = dtTurno(t.fecha, t.hora);
    if (f <= ahora || f - cfg.recordarTurnoHs * 36e5 > ahora) return;
    const un = uni(t.unidadId), c = usr(t.clienteId), dia = diaTxt(t.fecha);
    aviso(t.clienteId, 'recordatorio_turno', 'Recordatorio de tu turno', `${dia} a las ${t.hora} hs · ${t.motivo}${un ? ` · ${un.nombre} (${un.sede})` : ''}`, 'turno', t.id, 'rec-turno-' + t.id);
    avisoDueno('gm', 'recordatorios', 'recordatorio_turno', `Turno ${dia.toLowerCase()} a las ${t.hora} hs`, `${c ? iniciales(c.nombre) : 'Cliente'} · ${t.motivo}`, 'turno', t.id, 'rec-turno-' + t.id);
  });
  DB.presupuestos.filter(p => p.estado === 'aceptado' && p.fecha).forEach(p => {
    const f = dtTurno(p.fecha, p.hora || '08:00');
    if (f <= ahora || f - cfg.recordarMudanzaHs * 36e5 > ahora) return;
    const dia = diaTxt(p.fecha);
    aviso(p.clienteId, 'recordatorio_mudanza', 'Recordatorio de tu ' + (p.servicio === 'Mudanza' ? 'mudanza' : 'servicio'), `${dia}${p.hora ? ' a las ' + p.hora + ' hs' : ''} · ${p.servicio}`, 'presupuesto', p.id, 'rec-pres-' + p.id);
    avisoDueno(sectorDe(p.servicio), 'recordatorios', 'recordatorio_mudanza', `${p.servicio} ${dia.toLowerCase()}${p.hora ? ' a las ' + p.hora + ' hs' : ''}`, iniciales(p.nombre) + (p.destino ? ' → ' + p.destino : ''), 'presupuesto', p.id, 'rec-pres-' + p.id);
  });
  return DB.avisos.length - n0;
}
// Una vez por semana, en uno de los días elegidos (miércoles o sábado por defecto), sin amontonar avisos
function promoSemanal(){
  const hoy = new Date(), n0 = DB.avisos.length, cfg = DB.config;
  const lunes = isoDate(addDays(hoy, -((hoy.getDay() + 6) % 7)));
  let h = 7; for (const ch of lunes) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  if (hoy.getDay() !== cfg.promoDias[h % cfg.promoDias.length]) return 0;
  clientes().forEach(c => {
    if ((c.avisos || {}).promos === false) return;
    if (DB.avisos.some(a => a.usuarioId === c.id && (a.tipo === 'promo_mensual' || a.tipo === 'promo_semanal') && a.creado > Date.now() - 3 * 864e5)) return;
    const partes = [], m = mensualDe(c.id), libre = creditoLibre(c.id);
    if (m && m.estado === 'disponible') partes.push(`${m.pct}% en ${TIPO_TXT[m.tipo]} (hasta el ${ddmm(finDeMes(m.mes))})`);
    if (libre > 0) partes.push(`${libre}% por tus referidos (mudanzas)`);
    const cuerpo = partes.length ? `Tenés disponible: ${partes.join(' y ')}. Se aplican solos cuando confirmemos tu presupuesto.`
      : `Recomendá PG Logística con tu código ${c.codigo} y sumá ${cfg.descReferente}% por cada referido que contrate (hasta ${cfg.tope}%).`;
    aviso(c.id, 'promo_semanal', 'Tus promociones de la semana', cuerpo, 'descuentos', null, 'promo-sem-' + lunes);
  });
  return DB.avisos.length - n0;
}
function tareasDemo(){
  if (!DEMO || !DB) return;

/* ---------- reglas de presupuestos y referidos ---------- */
function validarCodigo(raw, tel){
  const code = normCodigo(raw);
  if (!code) return { vacio:true };
  const ref = DB.usuarios.find(u => u.rol === 'cliente' && u.codigo === code);
  if (!ref) return { error:'No encontramos ese código. Revisá que esté bien escrito.' };
  const t = digits(tel);
  if (t.length >= 8) {
    const fin = t.slice(-8);
    if (DB.usuarios.some(u => u.rol === 'cliente' && digits(u.telefono).slice(-8) === fin))
      return { error:'Los códigos son para clientes nuevos y ese teléfono ya tiene cuenta.' };
    if (DB.presupuestos.some(p => p.codigoRefId && digits(p.telefono).slice(-8) === fin && p.estado !== 'cancelado' && p.estado !== 'rechazado'))
      return { error:'Ya se usó un código de referido con este teléfono.' };
  }
  return { ok:true, ref, pct:DB.config.descReferido };
}
function crearPres(d){
  DB.seq.pres++;
  const cl = d.clienteId ? usr(d.clienteId) : null;
  let codigoRefId = null, codigo = '';
  if (!cl) {
    const v = validarCodigo(d.codigo, d.telefono);
    if (v.ok && d.servicio === 'Mudanza') { codigoRefId = v.ref.id; codigo = normCodigo(d.codigo); }
  } else if (cl.referidoPor && d.servicio === 'Mudanza' && !DB.presupuestos.some(p => p.clienteId === cl.id && p.codigoRefId && p.estado !== 'cancelado' && p.estado !== 'rechazado')) {
    const rf = usr(cl.referidoPor);       // se registró con un código: lo usa en su primera mudanza
    if (rf) { codigoRefId = rf.id; codigo = rf.codigo; }
  }
  const p = { id:uid(), num:DB.seq.pres, clienteId:d.clienteId||null, nombre:d.nombre, telefono:d.telefono, servicio:d.servicio, origen:d.origen, destino:d.destino, fecha:d.fecha, hora:'', detalle:d.detalle,
    codigo, codigoRefId, estado:'pendiente', monto:0, descRef:0, descCred:0, descMensual:0, nota:'', recompensado:false, creado:Date.now() };
  DB.presupuestos.push(p); avisosPres(p, null, false, esDueno()); save();
  return p;
}
function generarCodigo(nombre){
  const base = sinAcentos(primerNombre(nombre)).toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6) || 'CLI';
  let code; do { code = `PG-${base}${pad(Math.floor(Math.random()*90)+10)}`; } while (DB.usuarios.some(u => u.codigo === code));
  return code;

/* =====================================================================
   Conexión con Supabase (solo fetch, sin librerías)
   Auth: usuario → usuario@DOMINIO. Lectura: tablas protegidas por RLS.
   Escritura: siempre por funciones del servidor (rpc) o por la función
   "admin-clientes" (alta/baja de clientes y claves).
   ===================================================================== */
const KSN = 'pg-sb-sesion';
let ses = null, refrescando = null;
const leerSesion = () => { try { const s = JSON.parse(ls.get(KSN) || 'null'); ses = s && s.refresh ? s : null; } catch(e){ ses = null; } };
const guardarSesion = s => { ses = s; if (s) ls.set(KSN, JSON.stringify(s)); else ls.del(KSN); };
const sesDe = j => ({ access:j.access_token, refresh:j.refresh_token, exp:j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), id:j.user && j.user.id });
const sinSesion = () => { const e = new Error('Tu sesión venció. Ingresá de nuevo.'); e.sesion = true; return e; };
const sinRed = () => { const e = new Error('No hay conexión. Revisá tu internet e intentá de nuevo.'); e.red = true; return e; };

function errDe(status, j){
  const e = new Error('No se pudo completar. Probá de nuevo en un momento.');
  e.status = status;
  e.code = (j && (j.error_code || (typeof j.code === 'string' ? j.code : ''))) || '';
  const texto = j && (j.message || j.msg || j.error_description || (typeof j.error === 'string' ? j.error : ''));
  if (e.code === 'invalid_credentials' || (j && j.error === 'invalid_grant') || /invalid login/i.test(texto || '')) e.message = 'Usuario o contraseña incorrectos.';
  else if (e.code === 'same_password') e.message = 'La contraseña nueva tiene que ser distinta de la actual.';
  else if (e.code === 'weak_password') e.message = 'Esa contraseña es muy fácil de adivinar. Probá con otra.';
  else if (j && typeof j.error === 'string' && !j.error_code && !j.error_description && status < 500) e.message = j.error;   // función de servidor (ya en español)
  else if (status === 429) e.message = 'Demasiados intentos. Esperá unos minutos y probá de nuevo.';
  else if (e.code === '23505') e.message = 'Ya existe uno igual.';
  else if (e.code === 'P0001' && texto) e.message = texto;                                   // reglas del negocio, ya en español
  return e;
}

async function pedirRed(url, opc){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
  try { return await fetch(url, { ...opc, signal:ctl.signal }); }
  catch(e){ throw sinRed(); }
  finally { clearTimeout(t); }
}
async function refrescar(){
  if (!ses) throw sinSesion();
  if (!refrescando) {
    refrescando = (async () => {
      let r, j = null;
      try {
        r = await pedirRed(NUBE_URL + '/auth/v1/token?grant_type=refresh_token', { method:'POST', headers:{ apikey:NUBE_KEY, 'Content-Type':'application/json' }, body:JSON.stringify({ refresh_token:ses.refresh }) });
        j = await r.json().catch(() => null);
      } finally { refrescando = null; }
      if (!r.ok || !j || !j.access_token) { guardarSesion(null); throw sinSesion(); }
      guardarSesion(sesDe(j));
    })();
  }
  return refrescando;
}
async function http(ruta, o = {}){
  const usaToken = o.auth !== false;
  const intento = async reintento => {
    if (usaToken && ses && ses.exp - Date.now() / 1000 < 60) await refrescar();
    const h = { apikey:NUBE_KEY, ...(o.headers || {}) };
    if (o.body !== undefined) h['Content-Type'] = 'application/json';
    if (usaToken && ses) h.Authorization = 'Bearer ' + ses.access;
    const r = await pedirRed(NUBE_URL + ruta, { method:o.method || 'GET', headers:h, body:o.body === undefined ? undefined : JSON.stringify(o.body) });
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
    if (r.status === 401 && usaToken && ses && !reintento) { await refrescar(); return intento(true); }
    if (!r.ok) throw errDe(r.status, j);
    return j;
  };
  return intento(false);
}
const GET = ruta => http('/rest/v1/' + ruta);
const RPC = (fn, args, anonimo) => http('/rest/v1/rpc/' + fn, { method:'POST', body:args || {}, auth:!anonimo });
const FN = (cuerpo, anonimo) => http('/functions/v1/admin-clientes', { method:'POST', body:cuerpo, auth:!anonimo });
const ESCRIBIR = { 'Prefer':'return=representation' };
async function escribir(metodo, ruta, cuerpo){      // para que un cambio bloqueado por permisos no pase en silencio
  const r = await http('/rest/v1/' + ruta, { method:metodo, body:cuerpo, headers:ESCRIBIR });
  if (!Array.isArray(r) || !r.length) throw new Error('No tenés permiso para hacer este cambio.');
  return r;
}

async function cargarPublico(){
  try { const r = await GET('config?select=*&id=eq.1'); if (r && r[0]) DB.config = deConfig(r[0]); return true; } catch(e){ return false; }
}
let mesAsegurado = '';
async function cargarTodo(){
  const yoId = S.user && S.user.id;
  const desde = hoyISO(), hasta = isoDate(addDays(new Date(), 90));
  const leer = () => Promise.all([
    GET('config?select=*&id=eq.1'),
    GET('perfiles?select=*&order=creado_en'),
    GET('unidades?select=*&order=sede,nombre'),
    GET('turnos?select=*&order=fecha.desc,hora.desc&limit=1000'),
    GET('presupuestos?select=*&order=creado_en.desc&limit=1000'),
    RPC('ocupacion', { p_desde:desde, p_hasta:hasta }),
    RPC('mis_referidos'),                      // para el dueño vuelve vacío
    GET('avisos?select=*&order=creado_en.desc&limit=150'),
    GET('descuentos_mensuales?select=*&order=mes.desc&limit=1000'),
    GET('creditos_ref?select=*&order=creado_en.desc&limit=1000'),
    GET('inventario?select=*&order=nombre&limit=5000')
  ]);
  let r = await leer();
  const yoPer = (r[1] || []).find(x => x.id === yoId);
  // cada cliente tiene su descuento del mes: si todavía no se sorteó, se pide una sola vez por mes y se vuelve a leer
  if (yoPer && yoPer.rol === 'cliente' && mesAsegurado !== mesActualISO()) {
    try { await RPC('asegurar_mi_descuento'); mesAsegurado = mesActualISO(); r = await leer(); } catch(e){ if (e.sesion) throw e; }
  }
  const [cfg, per, uns, tur, pre, ocu, ref, avs, men, cre, inv] = r;
  const db = baseVacia();
  if (cfg && cfg[0]) db.config = deConfig(cfg[0]);
  db.usuarios = (per || []).map(dePerfil);
  db.unidades = (uns || []).map(deUnidad);
  db.unidades.forEach(u => { const c = u.clienteId && db.usuarios.find(x => x.id === u.clienteId); if (c) c.unidadId = u.id; });
  db.turnos = (tur || []).map(deTurno);
  db.presupuestos = (pre || []).map(dePres);
  db.seq.pres = db.presupuestos.reduce((m, p) => Math.max(m, p.num), 0);
  (ocu || []).forEach(o => { db.ocup[o.fecha + '|' + o.hora] = o.usados; });
  db.referidos = (ref || []).map(x => ({ num:x.num, nombre:x.nombre, servicio:x.servicio, estado:x.estado, creado:Date.parse(x.creado_en) }));
  db.avisos = (avs || []).map(deAviso);
  db.mensuales = (men || []).map(deMensual);
  db.creditos = (cre || []).map(deCredito);
  db.inventario = (inv || []).map(deItem);
  const yo = db.usuarios.find(u => u.id === yoId);
  if (!yo) throw sinSesion();                         // el perfil ya no existe (por ejemplo, se eliminó la cuenta)
  DB = db; S.user = yo;
}
async function refrescarOcupacion(){
  if (!NUBE || !S.user) return;
  try {
    const ocu = await RPC('ocupacion', { p_desde:hoyISO(), p_hasta:isoDate(addDays(new Date(), 90)) });
    DB.ocup = {}; (ocu || []).forEach(o => { DB.ocup[o.fecha + '|' + o.hora] = o.usados; });
  } catch(e){}
}
function forzarSalida(msg){
  PUSH.soltarLocal();
  S.user = null; S.view = null; guardarSesion(null); DB = baseVacia(); cerrar(); render(); window.scrollTo(0, 0);
  if (msg) toast(msg);
  cargarPublico().then(() => { if (!S.user) render(); });
}
const fallo = e => { if (e.sesion) setTimeout(() => forzarSalida(e.message), 0); return { error:e.message }; };
const envolver = async fn => { try { return await fn(); } catch(e){ return fallo(e); } };
async function verificarClave(clave){                 // vuelve a ingresar con la clave actual: confirma que quien pide es el dueño de la cuenta
  const j = await http('/auth/v1/token?grant_type=password', { method:'POST', auth:false, body:{ email:S.user.usuario + '@' + DOMINIO, password:clave } });
  guardarSesion(sesDe(j));
}

  },

  async pedirTurno(d){
    const r = crearTurno({ ...d, estado:esDueno() ? 'confirmado' : 'pendiente' });
    return r.error ? r : { ok:true };
  },
  async cancelarTurno(id){ const r = cancelarTurno(id, esDueno()); return r.error ? r : { ok:true }; },
  async estadoTurno(id, estado){
    const t = turno(id); if (!t) return { error:'El turno no existe.' };
    const valido = (t.estado === 'pendiente' && (estado === 'confirmado' || estado === 'rechazado')) || (t.estado === 'confirmado' && estado === 'realizado');
    if (!valido) return { error:'Ese cambio de estado no es válido.' };
    const antes = t.estado; t.estado = estado; avisosTurno(t, antes); save(); return { ok:true };
  },
  async crearPres(d){
    if (!d.clienteId) {
      const v = validarCodigo(d.codigo, d.telefono);
      if (v.error) return { error:v.error };
      if (v.ok && d.servicio !== 'Mudanza') return { error:'El código de referido vale solo para mudanzas.' };
    }
    const p = crearPres(d);
    return { ok:true, pres:{ ...p, descuento:p.codigoRefId ? DB.config.descReferido : 0 } };
  },
  async confirmar(id, monto, nota, hora){
    const p = pres(id); if (!p || !['pendiente','cotizado'].includes(p.estado)) return { error:'Este presupuesto ya no se puede cotizar.' };
    if (!(monto > 0)) return { error:'Cargá el precio base.' };
    if (hora && !/^([01]\d|2[0-3]):[0-5]\d$/.test(hora)) return { error:'La hora no es válida. Usá el formato 24 hs, por ejemplo 09:30.' };
    confirmarLocal(p, monto, nota, hora); return { ok:true };
  },
  async responderPres(id, accion){
    const p = pres(id); if (!p || p.clienteId !== S.user.id) return { error:'No tenés permiso sobre este presupuesto.' };
    const map = { aceptar:['cotizado','aceptado'], rechazar:['cotizado','rechazado'], cancelar:['pendiente','cancelado'] };
    const m = map[accion]; if (!m || p.estado !== m[0]) return { error:'Ese cambio no es válido.' };
    setEstadoPres(p, m[1], false); save(); return { ok:true };
  },
  async estadoPres(id, estado){

function errItem(d){
  if (!d.nombre || d.nombre.trim().length < 1 || d.nombre.length > 120) return 'Escribí qué es (hasta 120 letras).';
  if (!Number.isInteger(d.cantidad) || d.cantidad < 1 || d.cantidad > 9999) return 'La cantidad es un número entre 1 y 9999.';
  if (!CONDICIONES.includes(d.condicion || 'Bueno')) return 'Elegí una condición de la lista.';
  if ((d.nota || '').length > 300) return 'El comentario puede tener hasta 300 letras.';
  return '';
}
// anonimizar: al borrar su propia cuenta, los pedidos del cliente dejan de mostrar sus datos personales
function quitarCliente(id, anonimizar){
  const c = usr(id); if (!c || c.rol !== 'cliente') return;
  DB.turnos.forEach(t => { if (t.clienteId === id && activo(t)) { t.estado = 'cancelado'; t.canceladoPor = 'dueno'; } });
  DB.unidades.forEach(u => { if (u.clienteId === id) u.clienteId = null; });
  DB.presupuestos.forEach(p => { if (p.clienteId === id) { p.clienteId = null; if (anonimizar) { p.nombre = 'Cliente eliminado'; p.telefono = ''; p.origen = ''; p.destino = ''; p.detalle = ''; } } });
  DB.usuarios.forEach(u => { if (u.referidoPor === id) u.referidoPor = null; });
  DB.avisos = DB.avisos.filter(a => a.usuarioId !== id); DB.mensuales = DB.mensuales.filter(m => m.clienteId !== id);
  DB.creditos = DB.creditos.filter(x => x.clienteId !== id); DB.inventario = DB.inventario.filter(i => i.clienteId !== id);
  DB.usuarios = DB.usuarios.filter(u => u.id !== id); save();
}

/* =====================================================================
   Notificaciones en el teléfono (Firebase Cloud Messaging)
   Solo existen en la app instalada (Capacitor) y con el servidor real:
   en el navegador y en modo demo nada de esto hace nada.
   El servidor manda cada aviso nuevo (los mismos de la campana) a los
   teléfonos que esa persona registró. Cada persona puede apagarlas.
   ===================================================================== */
const VERSION_APP = '10 nov 2026';
const PUSH = (() => {
  const KOFF = 'pg-push-off', KTOK = 'pg-push-tok';
  let escuchando = false, iniciadoPara = null, pendiente = false;

  const plugin = () => {
    try {
      const c = window.Capacitor;
      return (NUBE && c && c.isNativePlatform && c.isNativePlatform() && c.Plugins && c.Plugins.FirebaseMessaging) || null;
    } catch(e){ return null; }
  };
  const plataforma = () => { try { return window.Capacitor.getPlatform() === 'ios' ? 'ios' : 'android'; } catch(e){ return 'android'; } };
  const apagados = () => { try { return JSON.parse(ls.get(KOFF) || '{}') || {}; } catch(e){ return {}; } };
  const guardarApagado = (id, off) => { const m = apagados(); if (off) m[id] = 1; else delete m[id]; ls.set(KOFF, JSON.stringify(m)); };

  const disponible = () => !!plugin();
  const activo = () => !!S.user && !apagados()[S.user.id];

  async function registrar(token){
    if (!token || !S.user) return;
    ls.set(KTOK, token);
    try { await RPC('registrar_dispositivo', { p_token:token, p_plataforma:plataforma() }); }
    catch(e){ console.warn('No se pudo registrar el teléfono:', e && e.message); }
  }
  function abrirAvisos(){
    if (S.user) { if (S.view !== 'avisos') go('avisos'); refrescarSilencioso(true); }     // se trae el aviso nuevo aunque los datos sean de hace poco
    else pendiente = true;                          // la app todavía está arrancando: se abre cuando haya sesión
  }
  function escuchar(){
    const FM = plugin(); if (!FM || escuchando) return; escuchando = true;
    try {
      FM.addListener('tokenReceived', ev => { if (ev && ev.token && S.user && activo()) registrar(ev.token); });
      FM.addListener('notificationReceived', () => { if (S.user) refrescarSilencioso(true, true); });   // con la app abierta: se muestra como cartel y en la campana
      FM.addListener('notificationActionPerformed', () => abrirAvisos());                              // al tocar la notificación
    } catch(e){ escuchando = false; }
  }
  // 'ok' | 'denegado' | 'error' | 'no' (no disponible o apagado)
  async function iniciar(){
    const FM = plugin();
    if (!FM || !S.user || !activo() || iniciadoPara === S.user.id) return 'no';
    iniciadoPara = S.user.id; escuchar();
    try {
      const p = await FM.requestPermissions();
      if (!p || p.receive !== 'granted') return 'denegado';
      const t = await FM.getToken();
      await registrar(t && t.token);
      return 'ok';
    } catch(e){ iniciadoPara = null; console.warn('Notificaciones no disponibles:', e && e.message); return 'error'; }
  }
  // Al salir: este teléfono deja de recibir los avisos de esta persona (otra puede ingresar después).
  async function quitar(){
    const FM = plugin(); iniciadoPara = null; if (!FM) return;
    const tok = ls.get(KTOK);
    if (tok && S.user) { try { await RPC('quitar_dispositivo', { p_token:tok }); } catch(e){} }
    ls.del(KTOK);
    try { await FM.deleteToken(); } catch(e){}
  }
  function soltarLocal(){                             // sin sesión (venció o se eliminó la cuenta): solo se invalida el código de este teléfono
    const FM = plugin(); iniciadoPara = null; ls.del(KTOK); if (!FM) return;
    try { FM.deleteToken().catch(() => {}); } catch(e){}
  }
  async function cambiar(on){
    if (!S.user) return 'no';
    guardarApagado(S.user.id, !on);
    if (!on) { await quitar(); return 'apagado'; }
    iniciadoPara = null;
    return iniciar();
  }
  function alRenderizar(){
    if (!S.user) return;
    iniciar();
    if (pendiente) { pendiente = false; setTimeout(() => { if (S.user) go('avisos'); }, 0); }
  }
  return { disponible, activo, iniciar, quitar, soltarLocal, cambiar, alRenderizar, escuchar };
})();

/* ---------- tema ---------- */
function temaEfectivo(){
  const a = document.documentElement.getAttribute('data-theme');
  if (a === 'dark' || a === 'light') return a;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function aplicarTema(t){ if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); }

/* ---------- aviso y modal ---------- */
let toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200);
}
let lastFocus = null;
function abrir(titulo, html){
  lastFocus = document.activeElement;
  $('#modal-root').innerHTML = `<div class="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="sheet-h"><h2 class="h2">${esc(titulo)}</h2><button class="icon-btn" data-act="cerrar" aria-label="Cerrar">${ic('x')}</button></div>
    <div class="stack">${html}</div></div></div>`;
  document.documentElement.classList.add('lock');
  const f = $('#modal-root .in, #modal-root select'); if (f && matchMedia('(min-width:720px)').matches) f.focus();
}
function cerrar(){
  $('#modal-root').innerHTML = ''; document.documentElement.classList.remove('lock');
  if (lastFocus && lastFocus.isConnected) try { lastFocus.focus(); } catch(e){}
}
function errModal(msg){ const e = $('#m-err'); if (e) { e.textContent = msg; e.hidden = false; e.scrollIntoView({block:'nearest'}); } }
async function copiar(texto){
  try { await navigator.clipboard.writeText(texto); toast('Copiado'); return; } catch(e){}
  try { const t = document.createElement('textarea'); t.value = texto; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); toast(ok ? 'Copiado' : 'No se pudo copiar. Seleccionalo a mano.'); } catch(e){ toast('No se pudo copiar. Seleccionalo a mano.'); }
}
function armado(btn, txt){
  if (btn.dataset.armado) return true;
  btn.dataset.armado = '1'; btn.dataset.orig = btn.textContent; btn.textContent = txt;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armado; btn.textContent = btn.dataset.orig; } }, 4000);
  return false;
}

/* ---------- filas reutilizables ---------- */
function turnoRow(t, modo){
  const d = parseISO(t.fecha), u = usr(t.clienteId), un = uni(t.unidadId), fut = futuro(t);
  let acc = '';
  if (modo === 'dueno') {
    if (t.estado === 'pendiente' && fut) acc += `<button class="btn good sm" data-act="t-confirmar" data-id="${t.id}">${ic('check')}Confirmar</button><button class="btn danger sm" data-act="t-rechazar" data-id="${t.id}">Rechazar</button>`;
    else if (t.estado === 'confirmado' && fut) acc += `<button class="btn sec sm" data-act="t-cancelar" data-id="${t.id}">Cancelar</button>`;
    else if (t.estado === 'confirmado' && !fut) acc += `<button class="btn soft sm" data-act="t-realizado" data-id="${t.id}">Marcar realizado</button>`;
  } else if (activo(t) && fut) acc += `<button class="btn sec sm" data-act="t-cancelar" data-id="${t.id}">Cancelar turno</button>`;
  const past = !activo(t) || !fut;
  return `<li><div class="row">
    <div class="dt ${past && t.estado !== 'realizado' ? 'off' : ''}"><small>${MS[d.getMonth()]}</small><b>${d.getDate()}</b><small>${DS[d.getDay()]}</small></div>
    <div class="grow"><div class="t-main tnum">${t.hora} hs · ${esc(t.motivo)}</div>
      <div class="t-sub">${modo === 'dueno' ? esc(u ? u.nombre : 'Cliente eliminado') + ' · ' : ''}${un ? esc(un.nombre) + ' · ' + esc(un.sede) : 'Guardamueble'}</div>
      ${t.nota ? `<div class="t-note">${esc(t.nota)}</div>` : ''}</div>
    <div class="side">${badge(BT, t.estado)}${acc}</div></div></li>`;
}
function agrupar(lista, modo){
  if (!lista.length) return '';
  let out = '', dia = '';
  for (const t of lista) {
    if (t.fecha !== dia) { dia = t.fecha; out += `${out ? '</ul>' : ''}<div class="day-h">${fmtLargo(dia)}</div><ul class="list">`; }
    out += turnoRow(t, modo);
  }
  return out + '</ul>';
}
function presRow(p){
  const total = totalPres(p);
  return `<li><button class="row" data-act="pres-ver" data-id="${p.id}">
    <div class="dt off"><small>Nº</small><b>${p.num}</b></div>
    <div class="grow"><div class="t-main">${esc(p.servicio)} · ${esc(p.nombre)}</div>
      <div class="t-sub">${p.origen || p.destino ? esc(p.origen || '—') + ' → ' + esc(p.destino || '—') : 'Sin direcciones'}</div>
      ${p.fecha ? `<div class="t-note">Fecha estimada: ${fmtCorto(p.fecha)}</div>` : ''}</div>
    <div class="side">${p.codigoRefId ? `<span class="tag">${esc(p.codigo)}</span>` : ''}${total ? `<b class="tnum">${money(total)}</b>` : ''}${badge(BP, p.estado)}</div></button></li>`;
}
const vacio = (t, s, btn='') => `<div class="empty"><b>${t}</b><span>${s}</span>${btn}</div>`;

/* ---------- descuentos: bloques que se repiten ---------- */
function resumenDesc(u, propio = true){
  const cfg = DB.config, m = mensualDe(u.id), libre = creditoLibre(u.id), activo_ = creditoActivo(u.id);
  const em = m ? estadoMensual(m) : null;
  const mudanza = Math.min(libre, cfg.tope) + (m && em === 'disponible' && m.tipo === 'mudanza' ? m.pct : 0);

/* ---------- avisos ---------- */
function iconoAviso(tipo){
  if (/promo|referido/.test(tipo)) return 'gift';
  if (/presupuesto|mudanza/.test(tipo)) return 'quote';
  if (/turno/.test(tipo)) return 'calendar';
  return tipo === 'inventario' ? 'list' : 'bell';
}
function tiempoRel(ms){
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return 'ahora'; if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24); if (d === 1) return 'ayer'; if (d < 7) return `hace ${d} días`;
  return fmtCorto(isoDate(new Date(ms)));
}
function pushHTML(){
  if (!PUSH.disponible()) return '';
  return `<section class="card"><h2 class="h2">Notificaciones en este teléfono</h2>
    <label class="sw"><input type="checkbox" data-push="1" ${PUSH.activo() ? 'checked' : ''}><span class="sw-t"><b>Recibir avisos aunque la app esté cerrada</b><small>Te llegan al teléfono los mismos avisos de la campana. Si no te llegan, revisá que estén permitidas en los ajustes del teléfono.</small></span></label></section>`;
}

  const m = parseMonto($('#q-monto').value), d = previsionDescuentos(p);

  const nota = !p.clienteId ? 'Este pedido es de alguien sin cuenta: no lleva descuentos del mes ni por referidos' + (d.ref ? ', solo el código.' : '.')
    : hay ? '' : 'Este pedido no tiene descuentos.';
  el.innerHTML = m > 0 ? bloqueTotal(m, d) + (nota ? `<p class="hint" style="margin-top:6px">${nota}</p>` : '') + (d.sinSorteo ? '<p class="hint">Si el cliente todavía no tiene su descuento del mes, se sortea al confirmar.</p>' : '')
    : '<p class="hint">Cargá el precio base y ves el total con los descuentos que se aplican solos.</p>';
}

/* =====================================================================
   Presupuesto en PDF, con el mismo diseño que se ve en la app.
   Se dibuja en un lienzo (tamaño A4, 150 ppp) y se guarda como página de un PDF.
   Para compartirlo: menú de compartir del teléfono (app instalada o navegador);
   si no existe, se descarga para adjuntarlo en WhatsApp.
   ===================================================================== */
async function pdfPresupuesto(p){
  const W = 1240, H = 1754, k = W / 595.28;                     // trabajamos en puntos (A4 = 595 × 842) y se escala
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  try { await Promise.all([document.fonts.load('700 20px "Bricolage Grotesque"'), document.fonts.load('600 12px Figtree'), document.fonts.load('400 12px Figtree')]); } catch(e){}
  const C = { fg:'#0a1a35', fg2:'#3f526e', fg3:'#5f7089', line:'#d8e2f2', s2:'#e9f0fb', acc:'#1456d9', soft:'#e1ebfd', ink:'#0d3d9e', ok:'#0b7650', okS:'#dbf2e7', a:'#0f43b0', b:'#2271f2' };
  const fam = disp => (disp ? "'Bricolage Grotesque'," : "'Figtree',") + " system-ui, -apple-system, 'Segoe UI', sans-serif";
  const font = (peso, pt, disp) => `${peso} ${(pt * k).toFixed(1)}px ${fam(disp)}`;
  const X = v => v * k;
  const texto = (t, x, y, f, color, alinear) => { g.font = f; g.fillStyle = color; g.textAlign = alinear || 'left'; g.textBaseline = 'alphabetic'; g.fillText(t, X(x), X(y)); };
  const ancho = (t, f) => { g.font = f; return g.measureText(t).width / k; };
  const rr = (x, y, w, h, r, fill) => { g.beginPath(); g.roundRect ? g.roundRect(X(x), X(y), X(w), X(h), X(r)) : g.rect(X(x), X(y), X(w), X(h)); g.fillStyle = fill; g.fill(); };
  const lineas = (t, f, max, tope) => {
    const out = []; let linea = '';
    for (const palabra of String(t || '').replace(/\s+/g, ' ').trim().split(' ')) {
      const prueba = linea ? linea + ' ' + palabra : palabra;
      if (ancho(prueba, f) <= max) linea = prueba; else { if (linea) out.push(linea); linea = palabra; }
    }
    if (linea) out.push(linea);
    if (tope && out.length > tope) { out.length = tope; out[tope - 1] = out[tope - 1].replace(/.{0,2}$/, '') + '…'; }
    return out;
  };

  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);

  // --- cabecera ---
  const grad = g.createLinearGradient(0, 0, W, X(130)); grad.addColorStop(0, C.a); grad.addColorStop(1, C.b);
  g.fillStyle = grad; g.fillRect(0, 0, W, X(130));
  g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 1;
  for (let x = 0; x < 595; x += 28) { g.beginPath(); g.moveTo(X(x), 0); g.lineTo(X(x), X(130)); g.stroke(); }
  for (let y = 0; y < 130; y += 28) { g.beginPath(); g.moveTo(0, X(y)); g.lineTo(W, X(y)); g.stroke(); }
  let xTxt = 40;
  try {
    const img = new Image(); img.src = LOGO; await img.decode();
    const h = 58, w = h * img.naturalWidth / img.naturalHeight;
    rr(40, 36, w + 12, h + 12, 12, '#ffffff'); g.drawImage(img, X(46), X(42), X(w), X(h)); xTxt = 40 + w + 12 + 12;
  } catch(e){}
  texto('PG Logística', xTxt, 78, font(700, 21, true), '#ffffff');
  texto('Mudanzas · Maquinaria · Guardamuebles', xTxt, 94, font(500, 9.5), 'rgba(255,255,255,.85)');
  texto('PRESUPUESTO', 555, 52, font(700, 9), 'rgba(255,255,255,.85)', 'right');
  texto(nPres(p), 555, 84, font(700, 30, true), '#ffffff', 'right');
  texto('Emitido el ' + fmtLargo(isoDate(new Date())).replace(/^\S+\s/, '') + ' de ' + new Date().getFullYear(), 555, 102, font(500, 9.5), 'rgba(255,255,255,.85)', 'right');

  // --- cuerpo ---
  let y = 172;
  texto(p.servicio, 40, y, font(700, 22, true), C.fg); y += 20;
  texto('Para ' + p.nombre, 40, y, font(500, 11.5), C.fg2); y += 30;
  const filas = [['Teléfono', p.telefono], ['Origen', p.origen], ['Destino', p.destino],
    ['Fecha estimada', p.fecha ? fmtLargo(p.fecha) + (p.hora ? ' · ' + p.hora + ' hs' : '') : ''], ['Detalle', p.detalle]].filter(f => f[1]);
  const fv = font(500, 11);
  for (const [et, val] of filas) {
    const ls = lineas(val, fv, 395, et === 'Detalle' ? 6 : 3);
    texto(et, 40, y, font(600, 10), C.fg3);
    ls.forEach((l, i) => texto(l, 150, y + i * 15, fv, C.fg));
    y += Math.max(1, ls.length) * 15 + 7;
  }
  y += 8;
  g.fillStyle = C.line; g.fillRect(X(40), X(y), X(515), 2); y += 28;

  // --- precio y descuentos (igual que el bloque de la app) ---
  const d = calc(p.monto, dPres(p));
  const altoPanel = 62 + d.filas.length * 24 + (d.filas.length ? 26 : 0);
  rr(40, y, 515, altoPanel, 14, C.s2);
  let yy = y + 30;
  texto('Precio base', 60, yy, font(500, 12.5), C.fg); texto(money(p.monto), 535, yy, font(600, 12.5), C.fg, 'right'); yy += 6;
  d.filas.forEach(f => { yy += 24; texto(f.txt, 60, yy, font(600, 11.5), C.ok); texto('−' + money(f.imp), 535, yy, font(600, 11.5), C.ok, 'right'); });
  yy += 22;
  g.fillStyle = C.line; g.fillRect(X(60), X(yy - 8), X(475), 2);
  yy += 22;
  texto('Total', 60, yy, font(700, 20, true), C.fg); texto(money(d.total), 535, yy, font(700, 24, true), C.acc, 'right');
  y += altoPanel + 14;
  if (d.filas.length) {
    const t = `Ahorrás ${money(d.ahorro)} (${d.pct}% de descuento sobre el precio base)`;
    const wTxt = ancho(t, font(600, 10.5)) + 24;
    rr(40, y, wTxt, 24, 12, C.okS); texto(t, 52, y + 16, font(600, 10.5), C.ok); y += 40;
  } else y += 14;

  if (p.nota) {
    texto('Incluye / condiciones', 40, y, font(700, 10), C.fg3); y += 18;
    const ls = lineas(p.nota, font(500, 11), 515, 7);
    ls.forEach((l, i) => texto(l, 40, y + i * 15.5, font(500, 11), C.fg));
    y += ls.length * 15.5 + 12;
  }

  // --- pie ---
  g.fillStyle = C.line; g.fillRect(X(40), X(772), X(515), 2);
  texto('PG Logística', 40, 796, font(700, 11, true), C.ink);
  texto('Presupuesto generado desde la app de PG Logística.', 40, 811, font(500, 9.5), C.fg3);
  if (DB.config.whatsapp) { texto('Consultas por WhatsApp', 555, 796, font(600, 9.5), C.fg3, 'right'); texto(DB.config.whatsapp, 555, 811, font(700, 11), C.ink, 'right'); }

  const jpeg = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.92));
  if (!jpeg) throw new Error('No se pudo generar el PDF.');
  return jpegAPdf(new Uint8Array(await jpeg.arrayBuffer()), W, H);
}

// Arma un PDF de una página con la imagen (sin librerías)
function jpegAPdf(jpeg, wPx, hPx){
  const enc = new TextEncoder(), partes = [], offs = []; let largo = 0;
  const add = x => { const b = typeof x === 'string' ? enc.encode(x) : x; partes.push(b); largo += b.length; };
  const obj = (n, cuerpo) => { offs[n] = largo; add(`${n} 0 obj\n${cuerpo}\nendobj\n`); };
  add('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4] = largo;
  add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
  add(jpeg); add('\nendstream\nendobj\n');
  const cont = 'q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n';
  obj(5, `<< /Length ${cont.length} >>\nstream\n${cont}endstream`);
  const xref = largo;
  let tabla = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) tabla += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  add(tabla + `trailer\n<< /Size 6 /Root 1 0 R /Info << /Title (Presupuesto PG Logistica) >> >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(partes, { type:'application/pdf' });
}
const aBase64 = blob => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => mal(r.error); r.readAsDataURL(blob); });
function descargar(blob, nombre){
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}
// El PDF se prepara de antemano al abrir el presupuesto: algunos teléfonos solo dejan compartir si se hace enseguida del toque
const pdfListos = new Map();
function pdfCacheado(p){
  const clave = JSON.stringify([p.id, p.monto, p.hora, p.nota, p.fecha, p.descRef, p.descCred, p.descMensual, p.nombre, p.telefono, p.origen, p.destino, p.detalle, DB.config.whatsapp]);
  if (!pdfListos.has(clave)) { if (pdfListos.size > 6) pdfListos.clear(); pdfListos.set(clave, pdfPresupuesto(p).catch(e => { pdfListos.delete(clave); throw e; })); }
  return pdfListos.get(clave);
}
// Devuelve { ok, descargado?, cancelado? } o { error }
async function compartirPresupuesto(p){
  try {
    const blob = await pdfCacheado(p), nombre = `Presupuesto ${nPres(p)} - PG Logistica.pdf`, titulo = `Presupuesto ${nPres(p)} de PG Logística`;
    const cap = window.Capacitor, pl = cap && cap.Plugins;
    if (cap && cap.isNativePlatform && cap.isNativePlatform() && pl && pl.Filesystem && pl.Share) {          // app instalada
      try {
        const f = await pl.Filesystem.writeFile({ path:`presupuesto-${nPres(p)}.pdf`, data:await aBase64(blob), directory:'CACHE' });
        await pl.Share.share({ title:titulo, text:titulo, url:f.uri, dialogTitle:'Compartir presupuesto' });
        return { ok:true };
      } catch(e){ if (/cancel/i.test((e && e.message) || '')) return { ok:true, cancelado:true }; }
    }
    const file = new File([blob], nombre, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {                                         // navegador con menú de compartir
      try { await navigator.share({ files:[file], title:titulo }); return { ok:true }; }
      catch(e){ if (e && e.name === 'AbortError') return { ok:true, cancelado:true }; }
    }
    descargar(blob, nombre); return { ok:true, descargado:true };
  } catch(e){ console.error(e); return { error:'No se pudo preparar el PDF. Probá de nuevo.' }; }
}

function refrescarCodigo(){
  const c = $('#pc'), m = $('#pc-msg'); if (!c || !m) return;
  const tel = ($('#pt') || {}).value || '';
  const pintar = v => {
    if (v.vacio) { m.className = 'hint'; m.textContent = `Si te recomendó un cliente, cargá su código y obtené ${DB.config.descReferido}% de descuento en tu mudanza.`; }
