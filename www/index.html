/* Concepto: app de depósito. Blancos con tinte azul, azul eléctrico como único acento,
   tipografía de rótulo de cajas (display) y lectura clara (cuerpo). Móvil primero, barra inferior. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;

  --bg:#f2f6fd;
  --surface:#ffffff;
  --surface-2:#e9f0fb;
  --line:#d8e2f2;
  --fg:#0a1a35;
  --fg-2:#3f526e;
  --fg-3:#5f7089;
  --accent:#1456d9;
  --accent-hover:#0f46b3;
  --on-accent:#ffffff;
  --accent-soft:#e1ebfd;
  --accent-ink:#0d3d9e;
  --ok:#0b7650; --ok-soft:#dbf2e7;
  --warn:#8a4f00; --warn-soft:#fbeed0;
  --bad:#b0232e; --bad-soft:#fde4e6;
  --hero-a:#0f43b0; --hero-b:#2271f2;
  --scrim:rgba(6,16,36,.55);
  --shadow:0 1px 2px rgba(10,30,70,.06),0 10px 28px rgba(10,30,70,.07);
  --logo-bg:transparent; --logo-pad:0px;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){

async function hash(usuario, pass){
  const s = 'pg|' + String(usuario).toLowerCase() + '|' + pass;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  } catch(e){
    let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0;
    return 'x' + (h >>> 0).toString(16);
  }
}

/* ---------- reglas de turnos ---------- */
function slotInfo(fecha, hora){
  // en la nube cada cliente ve cuántos lugares hay ocupados, sin ver de quién son los turnos
  const ocupados = NUBE ? (DB.ocup[fecha + '|' + hora] || 0) : DB.turnos.filter(t => t.fecha === fecha && t.hora === hora && activo(t)).length;
  return { libre: DB.config.cupo - ocupados, pasado: dtTurno(fecha, hora) <= new Date() };
}
function diasDisponibles(){
  const out = []; const h = new Date(); h.setHours(0,0,0,0);
  for (let i = 0; i <= DB.config.diasAnticipo; i++) {
    const d = addDays(h, i);
    if (DB.config.dias.includes(d.getDay())) out.push(isoDate(d));
  }
  return out;
}
function crearTurno({ clienteId, fecha, hora, motivo, nota, estado }){
  const u = usr(clienteId);
  if (!u || !u.unidadId) return { error:'Este cliente no tiene un guardamueble asignado.' };
  if (!fecha || !hora) return { error:'Elegí un día y un horario.' };
  const si = slotInfo(fecha, hora);
  if (si.pasado) return { error:'Ese horario ya pasó.' };
  if (si.libre <= 0) return { error:'Ese horario se completó. Elegí otro.' };
  const act = DB.turnos.filter(t => t.clienteId === clienteId && activo(t) && futuro(t));
  if (act.length >= 3) return { error:'Ya hay 3 turnos activos. Hay que cancelar uno para pedir otro.' };
  if (act.some(t => t.fecha === fecha)) return { error:'Ya hay un turno para ese día.' };
  const t = { id:uid(), clienteId, unidadId:u.unidadId, fecha, hora, motivo, nota:nota||'', estado, creado:Date.now() };
  DB.turnos.push(t); save();
  return { ok:t };
}
function cancelarTurno(id, porDueno){
  const t = turno(id);
  if (!t || !activo(t)) return { error:'Este turno ya no se puede cancelar.' };
  if (!porDueno) {
    const hs = (dtTurno(t.fecha, t.hora) - new Date()) / 36e5;
    if (hs < DB.config.horasCancelar) return { error:`Se puede cancelar hasta ${DB.config.horasCancelar} hs antes. Avisanos por WhatsApp.` };
  }
  t.estado = 'cancelado'; t.canceladoPor = porDueno ? 'dueno' : 'cliente'; save();
  return { ok:true };
}

/* ---------- reglas de presupuestos y referidos ---------- */
function validarCodigo(raw, tel){
  const code = normCodigo(raw);
  if (!code) return { vacio:true };
  const ref = DB.usuarios.find(u => u.rol === 'cliente' && u.codigo === code);
  if (!ref) return { error:'No encontramos ese código. Revisá que esté bien escrito.' };
  const t = digits(tel);
  if (t.length >= 8) {
    const fin = t.slice(-8);
    if (DB.usuarios.some(u => u.rol === 'cliente' && digits(u.telefono).slice(-8) === fin))
      return { error:'Los códigos son para clientes nuevos y ese teléfono ya tiene cuenta.' };
    if (DB.presupuestos.some(p => p.codigoRefId && digits(p.telefono).slice(-8) === fin && p.estado !== 'cancelado' && p.estado !== 'rechazado'))
      return { error:'Ya se usó un código de referido con este teléfono.' };
  }
  return { ok:true, ref, pct:DB.config.descReferido };
}
function descuentosDe(p){
  const ref = p.codigoRefId ? DB.config.descReferido : 0;
  const cl = p.clienteId ? usr(p.clienteId) : null;
  const cred = cl ? Math.min(cl.credito || 0, Math.max(0, DB.config.tope - ref)) : 0;
  return { ref, cred };
}
const dctoDe = (monto, pct) => Math.round(monto * pct / 100);
const totalDe = (monto, ref, cred) => monto - dctoDe(monto, ref) - dctoDe(monto, cred);
function crearPres(d){
  DB.seq.pres++;
  const v = validarCodigo(d.codigo, d.telefono);
  const p = { id:uid(), num:DB.seq.pres, clienteId:d.clienteId||null, nombre:d.nombre, telefono:d.telefono, servicio:d.servicio, origen:d.origen, destino:d.destino, fecha:d.fecha, detalle:d.detalle,
    codigo: v.ok ? normCodigo(d.codigo) : '', codigoRefId: v.ok ? v.ref.id : null, estado:'pendiente', monto:0, descRef:0, descCred:0, nota:'', recompensado:false, creado:Date.now() };
  DB.presupuestos.push(p); save();
  return p;
}
function guardarCotizacion(p, monto, nota){
  const d = descuentosDe(p);
  p.monto = monto; p.descRef = d.ref; p.descCred = d.cred; p.nota = nota; p.estado = 'cotizado'; save();
}
function marcarRealizado(p){
  p.estado = 'realizado';
  const cl = p.clienteId ? usr(p.clienteId) : null;
  if (cl && p.descCred > 0) cl.credito = Math.max(0, (cl.credito || 0) - p.descCred);
  if (p.codigoRefId && !p.recompensado) {
    const rf = usr(p.codigoRefId);
    if (rf) rf.credito = Math.min(DB.config.tope, (rf.credito || 0) + DB.config.descReferente);
    p.recompensado = true;
  }
  save();
}
function generarCodigo(nombre){
  const base = sinAcentos(primerNombre(nombre)).toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6) || 'CLI';
  let code; do { code = `PG-${base}${pad(Math.floor(Math.random()*90)+10)}`; } while (DB.usuarios.some(u => u.codigo === code));
  return code;
}

/* =====================================================================
   Conexión con Supabase (solo fetch, sin librerías)
   Auth: usuario → usuario@DOMINIO. Lectura: tablas protegidas por RLS.
   Escritura: siempre por funciones del servidor (rpc) o por la función
   "admin-clientes" (alta/baja de clientes y claves).
   ===================================================================== */
const KSN = 'pg-sb-sesion';
let ses = null, refrescando = null;
const leerSesion = () => { try { const s = JSON.parse(ls.get(KSN) || 'null'); ses = s && s.refresh ? s : null; } catch(e){ ses = null; } };
const guardarSesion = s => { ses = s; if (s) ls.set(KSN, JSON.stringify(s)); else ls.del(KSN); };
const sesDe = j => ({ access:j.access_token, refresh:j.refresh_token, exp:j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), id:j.user && j.user.id });
const sinSesion = () => { const e = new Error('Tu sesión venció. Ingresá de nuevo.'); e.sesion = true; return e; };
const sinRed = () => { const e = new Error('No hay conexión. Revisá tu internet e intentá de nuevo.'); e.red = true; return e; };

function errDe(status, j){
  const e = new Error('No se pudo completar. Probá de nuevo en un momento.');
  e.status = status;
  e.code = (j && (j.error_code || (typeof j.code === 'string' ? j.code : ''))) || '';
  const texto = j && (j.message || j.msg || j.error_description || (typeof j.error === 'string' ? j.error : ''));
  if (e.code === 'invalid_credentials' || (j && j.error === 'invalid_grant') || /invalid login/i.test(texto || '')) e.message = 'Usuario o contraseña incorrectos.';
  else if (e.code === 'same_password') e.message = 'La contraseña nueva tiene que ser distinta de la actual.';
  else if (e.code === 'weak_password') e.message = 'Esa contraseña es muy fácil de adivinar. Probá con otra.';
  else if (status === 429) e.message = 'Demasiados intentos. Esperá unos minutos y probá de nuevo.';
  else if (e.code === '23505') e.message = 'Ya existe uno igual.';
  else if (e.code === 'P0001' && texto) e.message = texto;                                   // reglas del negocio, ya en español
  else if (j && typeof j.error === 'string' && !j.error_code && !j.error_description && status < 500) e.message = j.error;   // función de servidor
  return e;
}

async function pedirRed(url, opc){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
  try { return await fetch(url, { ...opc, signal:ctl.signal }); }
  catch(e){ throw sinRed(); }
  finally { clearTimeout(t); }
}
async function refrescar(){
  if (!ses) throw sinSesion();
  if (!refrescando) {
    refrescando = (async () => {
      let r, j = null;
      try {
        r = await pedirRed(NUBE_URL + '/auth/v1/token?grant_type=refresh_token', { method:'POST', headers:{ apikey:NUBE_KEY, 'Content-Type':'application/json' }, body:JSON.stringify({ refresh_token:ses.refresh }) });
        j = await r.json().catch(() => null);
      } finally { refrescando = null; }
      if (!r.ok || !j || !j.access_token) { guardarSesion(null); throw sinSesion(); }
      guardarSesion(sesDe(j));
    })();
  }
  return refrescando;
}
async function http(ruta, o = {}){
  const usaToken = o.auth !== false;
  const intento = async reintento => {
    if (usaToken && ses && ses.exp - Date.now() / 1000 < 60) await refrescar();
    const h = { apikey:NUBE_KEY, ...(o.headers || {}) };
    if (o.body !== undefined) h['Content-Type'] = 'application/json';
    if (usaToken && ses) h.Authorization = 'Bearer ' + ses.access;
    const r = await pedirRed(NUBE_URL + ruta, { method:o.method || 'GET', headers:h, body:o.body === undefined ? undefined : JSON.stringify(o.body) });
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
    if (r.status === 401 && usaToken && ses && !reintento) { await refrescar(); return intento(true); }
    if (!r.ok) throw errDe(r.status, j);
    return j;
  };
  return intento(false);
}
const GET = ruta => http('/rest/v1/' + ruta);
const RPC = (fn, args, anonimo) => http('/rest/v1/rpc/' + fn, { method:'POST', body:args || {}, auth:!anonimo });
const FN = cuerpo => http('/functions/v1/admin-clientes', { method:'POST', body:cuerpo });
const ESCRIBIR = { 'Prefer':'return=representation' };
async function escribir(metodo, ruta, cuerpo){      // para que un cambio bloqueado por permisos no pase en silencio
  const r = await http('/rest/v1/' + ruta, { method:metodo, body:cuerpo, headers:ESCRIBIR });
  if (!Array.isArray(r) || !r.length) throw new Error('No tenés permiso para hacer este cambio.');
  return r;
}

async function cargarPublico(){
  try { const r = await GET('config?select=*&id=eq.1'); if (r && r[0]) DB.config = deConfig(r[0]); return true; } catch(e){ return false; }
}
async function cargarTodo(){
  const yoId = S.user && S.user.id;
  const desde = hoyISO(), hasta = isoDate(addDays(new Date(), 90));
  const [cfg, per, uns, tur, pre, ocu, ref] = await Promise.all([
    GET('config?select=*&id=eq.1'),
    GET('perfiles?select=*&order=creado_en'),
    GET('unidades?select=*&order=sede,nombre'),
    GET('turnos?select=*&order=fecha.desc,hora.desc&limit=1000'),
    GET('presupuestos?select=*&order=creado_en.desc&limit=1000'),
    RPC('ocupacion', { p_desde:desde, p_hasta:hasta }),
    RPC('mis_referidos')                       // para el dueño vuelve vacío
  ]);
  const db = baseVacia();
  if (cfg && cfg[0]) db.config = deConfig(cfg[0]);
  db.usuarios = (per || []).map(dePerfil);
  db.unidades = (uns || []).map(deUnidad);
  db.unidades.forEach(u => { const c = u.clienteId && db.usuarios.find(x => x.id === u.clienteId); if (c) c.unidadId = u.id; });
  db.turnos = (tur || []).map(deTurno);
  db.presupuestos = (pre || []).map(dePres);
  db.seq.pres = db.presupuestos.reduce((m, p) => Math.max(m, p.num), 0);
  (ocu || []).forEach(o => { db.ocup[o.fecha + '|' + o.hora] = o.usados; });
  db.referidos = (ref || []).map(r => ({ num:r.num, nombre:r.nombre, servicio:r.servicio, estado:r.estado, creado:Date.parse(r.creado_en) }));
  const yo = db.usuarios.find(u => u.id === yoId);
  if (!yo) throw sinSesion();                         // el perfil ya no existe (por ejemplo, se eliminó la cuenta)
  DB = db; S.user = yo;
}
async function refrescarOcupacion(){
  if (!NUBE || !S.user) return;
  try {
    const ocu = await RPC('ocupacion', { p_desde:hoyISO(), p_hasta:isoDate(addDays(new Date(), 90)) });
    DB.ocup = {}; (ocu || []).forEach(o => { DB.ocup[o.fecha + '|' + o.hora] = o.usados; });
  } catch(e){}
}
function forzarSalida(msg){
  S.user = null; S.view = null; guardarSesion(null); DB = baseVacia(); cerrar(); render(); window.scrollTo(0, 0);
  if (msg) toast(msg);
  cargarPublico().then(() => { if (!S.user) render(); });
}
const fallo = e => { if (e.sesion) setTimeout(() => forzarSalida(e.message), 0); return { error:e.message }; };
const envolver = async fn => { try { return await fn(); } catch(e){ return fallo(e); } };
async function verificarClave(clave){                 // vuelve a ingresar con la clave actual: confirma que quien pide es el dueño de la cuenta
  const j = await http('/auth/v1/token?grant_type=password', { method:'POST', auth:false, body:{ email:S.user.usuario + '@' + DOMINIO, password:clave } });
  guardarSesion(sesDe(j));
}

  }),
  cotizar: (id, monto, nota) => envolver(async () => { await RPC('cotizar_presupuesto', { p_id:id, p_monto:monto, p_nota:nota }); await cargarTodo(); return { ok:true }; }),
  responderPres: (id, accion) => envolver(async () => { await RPC('responder_presupuesto', { p_id:id, p_accion:accion }); await cargarTodo(); return { ok:true }; }),
  estadoPres: (id, estado) => envolver(async () => {

    await cargarTodo(); return { ok:true, referente:r && r.referente, suma:(r && r.suma) || 0 };
  }),
  guardarCliente: d => envolver(async () => {
    if (!d.id) {
      const r = await FN({ accion:'crear', usuario:d.usuario, nombre:d.nombre, password:d.pass, telefono:d.telefono, unidad_id:d.unidadId });
      await cargarTodo(); return { ok:true, codigo:r.perfil && r.perfil.codigo };
    }
    const c = usr(d.id);
    try {
      if (c.nombre !== d.nombre || c.telefono !== d.telefono) await escribir('PATCH', 'perfiles?id=eq.' + d.id, { nombre:d.nombre, telefono:d.telefono });

  }),

    try { await verificarClave(clave); } catch(e){ if (e.status !== 400) throw e; return { error:'La contraseña no es correcta.' }; }
    await FN({ accion:'eliminar_yo' });

  })

const opsLocal = {
  async restaurar(){ const sid = ls.get(KS), u = sid && usr(sid); if (u) { S.user = u; return u; } return null; },
  cargarPublico: async () => true,
  refrescar: async () => {},
  refrescarOcupacion: async () => {},
  async login(usuario, clave){

    if (!(user && (await hash(user.usuario, clave)) === user.passHash)) return { error:'Usuario o contraseña incorrectos.' };
    S.user = user; ls.set(KS, user.id); return { user };
  },
  async salir(){ ls.del(KS); },
  async pedirTurno(d){
    const r = crearTurno({ ...d, estado:esDueno() ? 'confirmado' : 'pendiente' });
    return r.error ? r : { ok:true };
  },
  async cancelarTurno(id){ const r = cancelarTurno(id, esDueno()); return r.error ? r : { ok:true }; },
  async estadoTurno(id, estado){
    const t = turno(id); if (!t) return { error:'El turno no existe.' };
    const valido = (t.estado === 'pendiente' && (estado === 'confirmado' || estado === 'rechazado')) || (t.estado === 'confirmado' && estado === 'realizado');
    if (!valido) return { error:'Ese cambio de estado no es válido.' };
    t.estado = estado; save(); return { ok:true };
  },
  async crearPres(d){
    const e = d.clienteId ? null : validarCodigo(d.codigo, d.telefono).error;
    if (e) return { error:e };
    const p = crearPres(d);
    return { ok:true, pres:{ ...p, descuento:p.codigoRefId ? DB.config.descReferido : 0 } };
  },
  async cotizar(id, monto, nota){
    const p = pres(id); if (!p || !['pendiente','cotizado'].includes(p.estado)) return { error:'Ese cambio no es válido.' };
    guardarCotizacion(p, monto, nota); return { ok:true };
  },
  async responderPres(id, accion){
    const p = pres(id); if (!p || p.clienteId !== S.user.id) return { error:'No tenés permiso sobre este presupuesto.' };
    const map = { aceptar:['cotizado','aceptado'], rechazar:['cotizado','rechazado'], cancelar:['pendiente','cancelado'] };
    const m = map[accion]; if (!m || p.estado !== m[0]) return { error:'Ese cambio no es válido.' };
    p.estado = m[1]; save(); return { ok:true };
  },
  async estadoPres(id, estado){
    const p = pres(id); if (!p) return { error:'El presupuesto no existe.' };
    const desde = { aceptado:['cotizado'], rechazado:['pendiente','cotizado','aceptado'], realizado:['aceptado'] }[estado];
    if (!desde || !desde.includes(p.estado)) return { error:'Ese cambio no es válido.' };
    if (estado === 'realizado') {
      const rf = p.codigoRefId && !p.recompensado ? usr(p.codigoRefId) : null;
      marcarRealizado(p);
      return { ok:true, referente:rf ? rf.nombre : null, suma:rf ? DB.config.descReferente : 0 };
    }
    p.estado = estado; save(); return { ok:true, suma:0 };
  },
  async guardarCliente(d){
    if (!d.id && DB.usuarios.some(u => u.usuario === d.usuario)) return { error:'Ese usuario ya existe.' };
    let u = d.id ? usr(d.id) : null;
    if (!u) { u = { id:'u-' + uid(), usuario:d.usuario, passHash:await hash(d.usuario, d.pass), rol:'cliente', nombre:d.nombre, telefono:d.telefono, codigo:generarCodigo(d.nombre), credito:0, unidadId:null }; DB.usuarios.push(u); }
    else { u.nombre = d.nombre; u.telefono = d.telefono; if (d.pass) u.passHash = await hash(u.usuario, d.pass); }
    if ((u.unidadId || null) !== d.unidadId) {
      const old = uni(u.unidadId); if (old) old.clienteId = null;
      u.unidadId = null;
      const nu = d.unidadId ? uni(d.unidadId) : null;
      if (nu) { nu.clienteId = u.id; nu.desde = hoyISO(); u.unidadId = nu.id; }
      DB.turnos.filter(t => t.clienteId === u.id && activo(t) && futuro(t)).forEach(t => { if (u.unidadId) t.unidadId = u.unidadId; else { t.estado = 'cancelado'; t.canceladoPor = 'dueno'; } });
    }
    save(); return { ok:true, codigo:u.codigo };
  },
  async eliminarCliente(id){ quitarCliente(id, false); return { ok:true }; },
  async guardarUnidad(d){
    if (DB.unidades.some(u => u.id !== d.id && u.sede === d.sede && u.nombre.toLowerCase() === d.nombre.toLowerCase())) return { error:'Ya existe ese guardamueble en ese depósito.' };
    if (d.id) { const u = uni(d.id); u.nombre = d.nombre; u.sede = d.sede; u.m2 = d.m2; }
    else DB.unidades.push({ id:'un-' + uid(), nombre:d.nombre, sede:d.sede, m2:d.m2, clienteId:null, desde:null });
    save(); return { ok:true };
  },
  async eliminarUnidad(id){ const u = uni(id); if (!u || u.clienteId) return { error:'Ese guardamueble está ocupado.' }; DB.unidades = DB.unidades.filter(x => x.id !== id); save(); return { ok:true }; },
  async guardarConfig(parcial){ Object.assign(DB.config, parcial); save(); return { ok:true }; },
  async cambiarClave(actual, nueva){
    if ((await hash(S.user.usuario, actual)) !== S.user.passHash) return { error:'La contraseña actual no es correcta.' };
    if (nueva.length < MINPASS) return { error:`La nueva contraseña necesita ${MINPASS} caracteres como mínimo.` };
    S.user.passHash = await hash(S.user.usuario, nueva); save(); return { ok:true };
  },
  async eliminarMiCuenta(clave){
    if ((await hash(S.user.usuario, clave)) !== S.user.passHash) return { error:'La contraseña no es correcta.' };
    quitarCliente(S.user.id, true); ls.del(KS); return { ok:true };
  }
};
// anonimizar: al borrar su propia cuenta, los pedidos del cliente dejan de mostrar sus datos personales
function quitarCliente(id, anonimizar){
  const c = usr(id); if (!c || c.rol !== 'cliente') return;
  DB.turnos.forEach(t => { if (t.clienteId === id && activo(t)) { t.estado = 'cancelado'; t.canceladoPor = 'dueno'; } });
  DB.unidades.forEach(u => { if (u.clienteId === id) u.clienteId = null; });
  DB.presupuestos.forEach(p => { if (p.clienteId === id) { p.clienteId = null; if (anonimizar) { p.nombre = 'Cliente eliminado'; p.telefono = ''; p.origen = ''; p.destino = ''; p.detalle = ''; } } });
  DB.usuarios = DB.usuarios.filter(u => u.id !== id); save();
}

/* ---------- tema ---------- */
function temaEfectivo(){
  const a = document.documentElement.getAttribute('data-theme');
  if (a === 'dark' || a === 'light') return a;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function aplicarTema(t){ if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); }

/* ---------- aviso y modal ---------- */
let toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200);
}
let lastFocus = null;
function abrir(titulo, html){
  lastFocus = document.activeElement;
  $('#modal-root').innerHTML = `<div class="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="sheet-h"><h2 class="h2">${esc(titulo)}</h2><button class="icon-btn" data-act="cerrar" aria-label="Cerrar">${ic('x')}</button></div>
    <div class="stack">${html}</div></div></div>`;
  document.documentElement.classList.add('lock');
  const f = $('#modal-root .in, #modal-root select'); if (f && matchMedia('(min-width:720px)').matches) f.focus();
}
function cerrar(){
  $('#modal-root').innerHTML = ''; document.documentElement.classList.remove('lock');
  if (lastFocus && lastFocus.isConnected) try { lastFocus.focus(); } catch(e){}
}
function errModal(msg){ const e = $('#m-err'); if (e) { e.textContent = msg; e.hidden = false; e.scrollIntoView({block:'nearest'}); } }
async function copiar(texto){
  try { await navigator.clipboard.writeText(texto); toast('Copiado'); return; } catch(e){}
  try { const t = document.createElement('textarea'); t.value = texto; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); toast(ok ? 'Copiado' : 'No se pudo copiar. Seleccionalo a mano.'); } catch(e){ toast('No se pudo copiar. Seleccionalo a mano.'); }
}
function armado(btn, txt){
  if (btn.dataset.armado) return true;
  btn.dataset.armado = '1'; btn.dataset.orig = btn.textContent; btn.textContent = txt;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armado; btn.textContent = btn.dataset.orig; } }, 4000);
  return false;
}

/* ---------- filas reutilizables ---------- */
function turnoRow(t, modo){
  const d = parseISO(t.fecha), u = usr(t.clienteId), un = uni(t.unidadId), fut = futuro(t);
  let acc = '';
  if (modo === 'dueno') {
    if (t.estado === 'pendiente' && fut) acc += `<button class="btn good sm" data-act="t-confirmar" data-id="${t.id}">${ic('check')}Confirmar</button><button class="btn danger sm" data-act="t-rechazar" data-id="${t.id}">Rechazar</button>`;
    else if (t.estado === 'confirmado' && fut) acc += `<button class="btn sec sm" data-act="t-cancelar" data-id="${t.id}">Cancelar</button>`;
    else if (t.estado === 'confirmado' && !fut) acc += `<button class="btn soft sm" data-act="t-realizado" data-id="${t.id}">Marcar realizado</button>`;
  } else if (activo(t) && fut) acc += `<button class="btn sec sm" data-act="t-cancelar" data-id="${t.id}">Cancelar turno</button>`;
  const past = !activo(t) || !fut;
  return `<li><div class="row">
    <div class="dt ${past && t.estado !== 'realizado' ? 'off' : ''}"><small>${MS[d.getMonth()]}</small><b>${d.getDate()}</b><small>${DS[d.getDay()]}</small></div>
    <div class="grow"><div class="t-main tnum">${t.hora} hs · ${esc(t.motivo)}</div>
      <div class="t-sub">${modo === 'dueno' ? esc(u ? u.nombre : 'Cliente eliminado') + ' · ' : ''}${un ? esc(un.nombre) + ' · ' + esc(un.sede) : 'Guardamueble'}</div>
      ${t.nota ? `<div class="t-note">${esc(t.nota)}</div>` : ''}</div>
    <div class="side">${badge(BT, t.estado)}${acc}</div></div></li>`;
}
function agrupar(lista, modo){
  if (!lista.length) return '';
  let out = '', dia = '';
  for (const t of lista) {
    if (t.fecha !== dia) { dia = t.fecha; out += `${out ? '</ul>' : ''}<div class="day-h">${fmtLargo(dia)}</div><ul class="list">`; }
    out += turnoRow(t, modo);
  }
  return out + '</ul>';
}
function presRow(p){
  const total = p.monto > 0 ? totalDe(p.monto, p.descRef, p.descCred) : 0;
  return `<li><button class="row" data-act="pres-ver" data-id="${p.id}">
    <div class="dt off"><small>Nº</small><b>${p.num}</b></div>
    <div class="grow"><div class="t-main">${esc(p.servicio)} · ${esc(p.nombre)}</div>
      <div class="t-sub">${p.origen || p.destino ? esc(p.origen || '—') + ' → ' + esc(p.destino || '—') : 'Sin direcciones'}</div>

}

/* =====================================================================
   Modales
   ===================================================================== */
let T = {};
function pintarSlots(){
  const box = $('#slots'); if (!box) return;
  if (!T.fecha) { box.innerHTML = '<p class="hint" style="grid-column:1/-1">Elegí un día para ver los horarios.</p>'; }
  else box.innerHTML = DB.config.franjas.map(h => {
    const si = slotInfo(T.fecha, h), off = si.pasado || si.libre <= 0;
    return `<button type="button" class="slot" data-act="t-hora" data-h="${h}" aria-pressed="${T.hora === h}" ${off ? 'disabled' : ''}>${h}${off ? `<small>${si.pasado ? 'Pasó' : 'Completo'}</small>` : ''}</button>`;
  }).join('');
  const ok = $('#t-ok'); if (ok) ok.disabled = !(T.fecha && T.hora);
}
function mTurno(){
  const du = esDueno();
  if (!du && !S.user.unidadId) { toast('Todavía no tenés un guardamueble asignado.'); return; }
  const cl = du ? clientes().filter(c => c.unidadId) : [];
  if (du && !cl.length) { toast('Primero asigná un guardamueble a un cliente.'); return; }
  const dias = diasDisponibles(), un = du ? null : uni(S.user.unidadId);
  T = { fecha:null, hora:null };
  abrir(du ? 'Nuevo turno' : 'Pedir turno', `<form class="form" data-form="turno" novalidate>
    ${du ? `<div class="field"><label for="t-cli">Cliente</label><select class="in" id="t-cli">${cl.map(c => `<option value="${c.id}">${esc(c.nombre)} · ${esc(uni(c.unidadId).nombre)}</option>`).join('')}</select></div>`
      : `<p class="sub">Para ir a <b>${esc(un.nombre)}</b> · ${esc(un.sede)}. Se atiende con cita previa.</p>`}
    <div class="field"><span class="lbl">Día</span>${dias.length ? `<div class="dates" role="group" aria-label="Día">${dias.map(f => { const d = parseISO(f); return `<button type="button" class="chip-d" data-act="t-dia" data-f="${f}" aria-pressed="false"><small>${DS[d.getDay()]}</small><b>${d.getDate()}</b><small>${MS[d.getMonth()]}</small></button>`; }).join('')}</div>` : '<p class="hint">No hay días de atención configurados.</p>'}</div>
    <div class="field"><span class="lbl">Horario</span><div class="slots" id="slots"></div></div>
    <div class="field"><label for="t-mot">Motivo</label><select class="in" id="t-mot">${MOTIVOS.map(m => `<option>${m}</option>`).join('')}</select></div>
    <div class="field"><label for="t-nota">Comentario (opcional)</label><textarea class="in" id="t-nota" placeholder="Por ejemplo: voy a retirar dos cajas"></textarea></div>
    <p class="msg bad" id="m-err" role="alert" hidden></p>
    <div class="actions"><button type="button" class="btn sec" data-act="cerrar">Cancelar</button><button class="btn primary" id="t-ok" type="submit" disabled>${du ? 'Crear turno' : 'Solicitar turno'}</button></div>
  </form>`);
  pintarSlots();
  ops.refrescarOcupacion().then(() => pintarSlots());     // en la nube: lugares al día, por si otro cliente tomó uno
}
function mPresNuevo(){ abrir('Pedir presupuesto', formPresHTML(false)); }

function prevCot(p){
  const el = $('#q-prev'); if (!el) return;
  const m = parseMonto($('#q-monto').value), d = descuentosDe(p);
  el.innerHTML = m > 0 ? bloqueTotal(m, d.ref, d.cred) + ((d.ref || d.cred) ? '' : '<p class="hint" style="margin-top:6px">Este pedido no tiene descuentos.</p>') : '<p class="hint">Cargá el precio base y ves el total con descuentos.</p>';
}
const parseMonto = s => Number(String(s).replace(/[^\d]/g, '')) || 0;

function mPresDet(id){
  const p = pres(id); if (!p) return;
  const du = esDueno();
  if (!du && p.clienteId !== S.user.id) return;            // cada cliente ve solo lo suyo
  const ref = p.codigoRefId ? usr(p.codigoRefId) : null;
  const cotizado = p.monto > 0 && p.estado !== 'pendiente';
  const wa = p.telefono ? waLink(p.telefono, cotizado && p.estado === 'cotizado'
      ? `Hola ${primerNombre(p.nombre)}! Te paso el presupuesto de PG Logística (${nPres(p)}) para ${p.servicio}: total ${money(totalDe(p.monto, p.descRef, p.descCred))}. ${p.nota || ''}`.trim()
      : `Hola ${primerNombre(p.nombre)}! Te escribimos de PG Logística por tu pedido de presupuesto (${nPres(p)}).`) : '';
  let acciones = '';
  if (du) {
    if (p.estado === 'cotizado') acciones += `<button class="btn good" data-act="p-aceptado" data-id="${p.id}">Marcar aceptado</button>`;
    if (p.estado === 'aceptado') acciones += `<button class="btn primary" data-act="p-realizado" data-id="${p.id}">${ic('check')}Marcar realizado</button>`;
    if (['pendiente','cotizado','aceptado'].includes(p.estado)) acciones += `<button class="btn danger" data-act="p-rechazado" data-id="${p.id}">Rechazar</button>`;
    if (wa) acciones += `<a class="btn sec" href="${wa}" target="_blank" rel="noopener">${ic('chat')}WhatsApp</a>`;
  } else {
    if (p.estado === 'cotizado') acciones += `<button class="btn primary" data-act="p-aceptar" data-id="${p.id}">Aceptar cotización</button><button class="btn sec" data-act="p-no" data-id="${p.id}">No me interesa</button>`;
    if (p.estado === 'pendiente') acciones += `<button class="btn sec" data-act="p-cancelar" data-id="${p.id}">Cancelar pedido</button>`;
  }
  abrir(`${nPres(p)} · ${p.servicio}`, `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${badge(BP, p.estado)}${p.codigoRefId ? `<span class="tag">${esc(p.codigo)}</span>` : ''}</div>
    <dl class="dl">
      <dt>Solicitante</dt><dd>${esc(p.nombre)}${p.clienteId ? ' (cliente)' : ''}</dd>
      <dt>Teléfono</dt><dd>${esc(p.telefono) || '—'}</dd>
      ${p.origen ? `<dt>Origen</dt><dd>${esc(p.origen)}</dd>` : ''}${p.destino ? `<dt>Destino</dt><dd>${esc(p.destino)}</dd>` : ''}
      ${p.fecha ? `<dt>Fecha estimada</dt><dd>${fmtLargo(p.fecha)}</dd>` : ''}
      ${p.detalle ? `<dt>Detalle</dt><dd>${esc(p.detalle)}</dd>` : ''}
      ${ref && du ? `<dt>Lo recomendó</dt><dd>${esc(ref.nombre)}</dd>` : ''}
    </dl>
    ${cotizado ? `<div class="panel">${bloqueTotal(p.monto, p.descRef, p.descCred)}${p.nota ? `<p class="sub">${esc(p.nota)}</p>` : ''}</div>` : ''}
    ${du && (p.estado === 'pendiente' || p.estado === 'cotizado') ? `<form class="form" data-form="cotizar" data-id="${p.id}" novalidate>
      <div class="field"><label for="q-monto">Precio base (ARS)</label><input class="in" id="q-monto" inputmode="numeric" placeholder="Ej.: 150000" value="${p.monto || ''}"></div>
      <div class="panel" id="q-prev"></div>
      <div class="field"><label for="q-nota">Nota para el cliente (opcional)</label><textarea class="in" id="q-nota" placeholder="Qué incluye, ayudantes, condiciones de pago">${esc(p.nota)}</textarea></div>
      <p class="msg bad" id="m-err" role="alert" hidden></p>
      <button class="btn primary" type="submit">${p.estado === 'cotizado' ? 'Actualizar cotización' : 'Guardar cotización'}</button></form>` : ''}
    ${!du && p.estado === 'pendiente' ? '<p class="sub">Estamos revisando tu pedido. Te avisamos cuando tengamos el presupuesto.</p>' : ''}
    ${acciones ? `<div class="actions" style="justify-content:flex-start">${acciones}</div>` : ''}`);
  if (du) prevCot(p);
}

    <div class="field"><label for="k-g">Guardamueble</label><select class="in" id="k-g"><option value="">Sin asignar</option>${libres.map(u => `<option value="${u.id}" ${(c && c.unidadId === u.id) || (!c && unidadPre === u.id) ? 'selected' : ''}>${esc(u.nombre)} · ${esc(u.sede)} · ${u.m2} m²</option>`).join('')}</select></div>
    ${c ? `<p class="hint">Código de referido: <b>${esc(c.codigo)}</b> · Descuento acumulado: ${c.credito || 0}%</p>` : '<p class="hint">El código de referido se genera solo.</p>'}
    <p class="msg bad" id="m-err" role="alert" hidden></p>
    <div class="actions">${c ? `<button type="button" class="btn danger" data-act="del-cli" data-id="${c.id}">Eliminar</button>` : ''}<button type="button" class="btn sec" data-act="cerrar">Cancelar</button><button class="btn primary" type="submit">${c ? 'Guardar' : 'Crear cliente'}</button></div>
  </form>`);
}
function mUnidad(id){
  const un = id ? uni(id) : null;
  const sedes = [...new Set(DB.unidades.map(u => u.sede))];
  abrir(un ? 'Editar guardamueble' : 'Nuevo guardamueble', `<form class="form" data-form="unidad" data-id="${un ? un.id : ''}" novalidate>
    <div class="g2">
      <div class="field"><label for="g-n">Nombre o número</label><input class="in" id="g-n" placeholder="A-04" value="${un ? esc(un.nombre) : ''}"></div>
      <div class="field"><label for="g-m">Superficie (m²)</label><input class="in" id="g-m" inputmode="decimal" value="${un ? un.m2 : ''}"></div>
    </div>
    <div class="field"><label for="g-s">Depósito o sede</label><input class="in" id="g-s" list="sedes" placeholder="Depósito Central" value="${un ? esc(un.sede) : ''}"><datalist id="sedes">${sedes.map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
    <p class="msg bad" id="m-err" role="alert" hidden></p>
    <div class="actions">${un && !un.clienteId ? `<button type="button" class="btn danger" data-act="del-uni" data-id="${un.id}">Eliminar</button>` : ''}<button type="button" class="btn sec" data-act="cerrar">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>
  </form>`);
}

/* ---------- mi cuenta (clientes) ---------- */
function mCuenta(){
  const u = S.user, un = uni(u.unidadId);
  abrir('Mi cuenta', `<dl class="dl">
      <dt>Nombre</dt><dd>${esc(u.nombre)}</dd>
      <dt>Usuario</dt><dd>${esc(u.usuario)}</dd>
      ${u.telefono ? `<dt>Teléfono</dt><dd>${esc(u.telefono)}</dd>` : ''}
      ${un ? `<dt>Guardamueble</dt><dd>${esc(un.nombre)} · ${esc(un.sede)}</dd>` : ''}
    </dl>
    <form class="form" data-form="miClave" novalidate>
      <h3 class="h2" style="font-size:16px">Cambiar contraseña</h3>
      <div class="field"><label for="mc-p0">Contraseña actual</label><input class="in" id="mc-p0" type="password" autocomplete="current-password"></div>
      <div class="field"><label for="mc-p1">Contraseña nueva</label><input class="in" id="mc-p1" type="password" autocomplete="new-password"><span class="hint">Mínimo ${MINPASS} caracteres.</span></div>
      <p class="msg bad" id="m-err" role="alert" hidden></p>
      <div class="actions"><button class="btn primary" type="submit">Cambiar contraseña</button></div>
    </form>
    <div class="panel" style="display:grid;gap:8px">
      ${NUBE ? `<a href="${POLITICA_URL}" target="_blank" rel="noopener">Política de privacidad</a>` : ''}
      <button type="button" class="btn danger" data-act="cuenta-borrar" style="justify-self:start">Eliminar mi cuenta</button>
    </div>`);
}
function mEliminarCuenta(){
  abrir('Eliminar mi cuenta', `<p class="sub">Se borra tu usuario y se cancelan tus turnos pendientes. Tus pedidos de presupuesto dejan de mostrar tu nombre y teléfono. Esto no se puede deshacer.</p>
    <p class="msg warn">Si todavía tenés cosas guardadas, coordiná antes con PG Logística: eliminar la cuenta no retira tus pertenencias.</p>
    <form class="form" data-form="eliminarCuenta" novalidate>
      <div class="field"><label for="mc-del">Escribí tu contraseña para confirmar</label><input class="in" id="mc-del" type="password" autocomplete="current-password"></div>
      <p class="msg bad" id="m-err" role="alert" hidden></p>
      <div class="actions"><button type="button" class="btn sec" data-act="cerrar">Cancelar</button><button class="btn danger" type="submit">Eliminar definitivamente</button></div>
    </form>`);
}

/* =====================================================================
   Pantallas, acciones y arranque
   ===================================================================== */
const VISTAS_D = { resumen:vResumen, turnos:vTurnosD, presupuestos:vPresD, unidades:vUnidades, referidos:vRefD, ajustes:vAjustes };
const VISTAS_C = { inicio:vInicio, turnos:vTurnosC, presupuestos:vPresC, referidos:vRefC };

function render(){
  const root = $('#app');
  if (S.pub) { root.innerHTML = vPublico(); return; }
  if (!S.user) { root.innerHTML = vLogin(); return; }
  const V = esDueno() ? VISTAS_D : VISTAS_C;
  if (!V[S.view]) S.view = esDueno() ? 'resumen' : 'inicio';
  root.innerHTML = shell(V[S.view]());
}
function go(v){ S.view = v; render(); window.scrollTo(0, 0); refrescarSilencioso(); }

/* En la nube, al cambiar de pantalla o volver a la app se traen los datos más nuevos
   (sin pisar un formulario o una ventana que el usuario tenga abierta). */
let ultimaCarga = Date.now();
async function refrescarSilencioso(forzar){
  if (!NUBE || !S.user || ocupado || $('#modal-root .ov')) return;
  if (!forzar && Date.now() - ultimaCarga < 15000) return;
  const antes = S.view;
  try { await ops.refrescar(); ultimaCarga = Date.now(); }
  catch(e){ if (e.sesion) forzarSalida(e.message); return; }
  const a = document.activeElement;
  if (S.user && S.view === antes && !$('#modal-root .ov') && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refrescarSilencioso(); });

let tCod = null, seqCod = 0;
function refrescarCodigo(){
  const c = $('#pc'), m = $('#pc-msg'); if (!c || !m) return;
  const tel = ($('#pt') || {}).value || '';
  const pintar = v => {
    if (v.vacio) { m.className = 'hint'; m.textContent = `Si te recomendó un cliente, cargá su código y obtené ${DB.config.descReferido}% de descuento.`; }
    else if (v.error) { m.className = 'msg bad'; m.textContent = v.error; }
    else { m.className = 'msg ok'; m.textContent = `Código válido: ${v.pct}% de descuento en tu presupuesto.`; }
  };
  if (!NUBE) { pintar(validarCodigo(c.value, tel)); return; }
  clearTimeout(tCod);
  if (!normCodigo(c.value)) { seqCod++; pintar({ vacio:true }); return; }
  m.className = 'hint'; m.textContent = 'Revisando el código…';
  const n = ++seqCod;
  tCod = setTimeout(async () => {
    let v; try { v = await RPC('validar_codigo', { p_codigo:c.value, p_telefono:tel }, true); } catch(e){ v = { error:e.message }; }
    if (n === seqCod && $('#pc-msg')) pintar(v);
  }, 450);
}
function errEn(msg, id = 'm-err'){ const e = $('#' + id); if (e) { e.textContent = msg; e.hidden = false; e.scrollIntoView({ block:'nearest' }); } }
async function reiniciar(conEjemplos){
  DB = await crearBase(conEjemplos); save();
  S.user = null; ls.del(KS); cerrar(); render(); window.scrollTo(0, 0);
  toast(conEjemplos ? 'Ejemplos restablecidos. Ingresá de nuevo.' : 'Listo. Ingresá con admin y tu contraseña de dueño (pg2026 si no la cambiaste).');
}

/* Una sola operación a la vez: evita toques dobles mientras se espera al servidor. */
let ocupado = false;
async function corre(fn){
  if (ocupado) return;
  ocupado = true; document.documentElement.classList.add('busy');
  try { return await fn(); }
  catch(e){ console.error(e); toast('Algo salió mal. Probá de nuevo.'); }
  finally { ocupado = false; document.documentElement.classList.remove('busy'); }
}
const avisar = r => { if (r.error) { toast(r.error); return false; } return true; };

/* ---------- acciones por clic ---------- */
const cambiarT = async (a, estado, msg) => { const r = await ops.estadoTurno(a.dataset.id, estado); if (avisar(r)) { toast(msg); render(); } };
const cambiarP = async (id, estado, msg) => { const r = await ops.estadoPres(id, estado); if (avisar(r)) { cerrar(); toast(msg); render(); } return r; };
const responderP = async (a, accion, msg) => {
  const p = pres(a.dataset.id); if (!p || p.clienteId !== S.user.id) return;
  const r = await ops.responderPres(p.id, accion); if (avisar(r)) { cerrar(); toast(msg); render(); }
};
const ACT = {
  ir: a => go(a.dataset.v),
  tema: () => { const n = temaEfectivo() === 'dark' ? 'light' : 'dark'; aplicarTema(n); ls.set(KT, n); render(); },
  salir: async () => { await ops.salir(); S.user = null; cerrar(); render(); window.scrollTo(0, 0); },
  'pub-abrir': () => { S.pub = 'form'; render(); window.scrollTo(0, 0); },
  'pub-volver': () => { S.pub = null; S.pubOk = null; render(); window.scrollTo(0, 0); },
  demo: a => { $('#lu').value = a.dataset.u; $('#lp').value = a.dataset.p; $('#lp').focus(); },
  cerrar: () => cerrar(),
  cuenta: () => mCuenta(),
  'cuenta-borrar': () => mEliminarCuenta(),
  'm-turno': () => mTurno(),
  't-dia': a => { T.fecha = a.dataset.f; T.hora = null; $$('.chip-d').forEach(b => b.setAttribute('aria-pressed', String(b === a))); pintarSlots(); },
  't-hora': a => { T.hora = a.dataset.h; pintarSlots(); },
  't-cancelar': async a => {
    const t = turno(a.dataset.id); if (!t || (!esDueno() && t.clienteId !== S.user.id)) return;
    const r = await ops.cancelarTurno(t.id);
    if (avisar(r)) { toast('Turno cancelado'); render(); }
  },
  't-confirmar': a => cambiarT(a, 'confirmado', 'Turno confirmado'),
  't-rechazar': a => cambiarT(a, 'rechazado', 'Turno rechazado'),
  't-realizado': a => cambiarT(a, 'realizado', 'Turno marcado como realizado'),
  'filtro-t': a => { S.filtroT = a.dataset.v; render(); },
  'filtro-p': a => { S.filtroP = a.dataset.v; render(); },
  'm-pres': () => mPresNuevo(),
  'pres-ver': a => mPresDet(a.dataset.id),
  'p-aceptar': a => responderP(a, 'aceptar', 'Cotización aceptada. Te contactamos para coordinar la fecha.'),
  'p-no': a => responderP(a, 'rechazar', 'Listo, cerramos este pedido.'),
  'p-cancelar': a => responderP(a, 'cancelar', 'Pedido cancelado.'),
  'p-aceptado': a => cambiarP(a.dataset.id, 'aceptado', 'Presupuesto marcado como aceptado'),
  'p-rechazado': a => cambiarP(a.dataset.id, 'rechazado', 'Presupuesto rechazado'),
  'p-realizado': async a => {
    const r = await cambiarP(a.dataset.id, 'realizado', 'Presupuesto marcado como realizado');
    if (r && r.ok && r.referente && r.suma > 0) toast(`Realizado. ${r.referente} suma ${r.suma}% de descuento.`);
  },
  copiar: a => copiar(a.dataset.t),
  'm-cliente': a => mCliente(a.dataset.id || null, a.dataset.unidad),
  'm-unidad': a => mUnidad(a.dataset.id || null),
  'del-cli': async a => {
    if (!armado(a, 'Confirmar eliminación')) return;
    const r = await ops.eliminarCliente(a.dataset.id); if (avisar(r)) { cerrar(); toast('Cliente eliminado'); render(); }
  },
  'del-uni': async a => {
    if (!armado(a, 'Confirmar eliminación')) return;
    const r = await ops.eliminarUnidad(a.dataset.id); if (avisar(r)) { cerrar(); toast('Guardamueble eliminado'); render(); }
  },
  'reset-ej': a => { if (DEMO && armado(a, '¿Seguro? Tocá de nuevo')) return reiniciar(true); },
  'reset-vacio': a => { if (DEMO && armado(a, '¿Seguro? Tocá de nuevo')) return reiniciar(false); }
};
const SOLO_DUENO = new Set(['t-confirmar','t-rechazar','t-realizado','p-aceptado','p-rechazado','p-realizado','m-cliente','m-unidad','del-cli','del-uni','reset-ej','reset-vacio','filtro-p']);
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('ov')) { cerrar(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const f = ACT[a.dataset.act]; if (!f) return;
  if (SOLO_DUENO.has(a.dataset.act) && !esDueno()) return;
  corre(() => f(a, e));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root .ov')) cerrar(); });
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'pc' || id === 'pt') refrescarCodigo();
  if (id === 'q-monto') { const f = e.target.closest('form'); const p = f && pres(f.dataset.id); if (p) prevCot(p); }
});
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.filtro === 'u') { S.filtroU = e.target.value; render(); } });

/* ---------- formularios ---------- */
const leerPres = () => ({ nombre:$('#pn').value.trim(), telefono:$('#pt').value.trim(), servicio:$('#ps').value, fecha:$('#pf').value, origen:$('#po').value.trim(), destino:$('#pd').value.trim(), detalle:$('#pe').value.trim(), codigo:$('#pc') ? $('#pc').value : '' });
function validarPres(d){
  if (d.nombre.length < 2) return 'Escribí tu nombre.';
  if (digits(d.telefono).length < 8) return 'Escribí un teléfono válido, con característica.';
  if (!d.origen && !d.detalle) return 'Contanos de dónde sale o qué hay que mover.';
  return '';
}
const entero = (s, min, max) => { const n = Number(String(s).trim()); return Number.isInteger(n) && n >= min && n <= max ? n : null; };
const SOLO_DUENO_F = new Set(['cotizar','cliente','unidad','cfgDesc','cfgTurnos','cfgContacto']);
const FORMS = {
  async login(){
    const u = $('#lu').value.trim().toLowerCase(), p = $('#lp').value, err = $('#lerr');
    const r = await ops.login(u, p);
    if (r.error) { err.textContent = r.error; err.hidden = false; return; }
    S.view = r.user.rol === 'dueno' ? 'resumen' : 'inicio'; ultimaCarga = Date.now();
    render(); window.scrollTo(0, 0);
  },
  async turno(){
    const cid = esDueno() ? $('#t-cli').value : S.user.id;
    const r = await ops.pedirTurno({ clienteId:cid, fecha:T.fecha, hora:T.hora, motivo:$('#t-mot').value, nota:$('#t-nota').value.trim() });
    if (r.error) { errEn(r.error); await ops.refrescarOcupacion(); pintarSlots(); return; }
    cerrar(); toast(esDueno() ? 'Turno creado y confirmado' : 'Turno solicitado. Te lo confirmamos a la brevedad.'); render();
  },
  async presPub(){
    const d = leerPres(), e = validarPres(d); if (e) { errEn(e); return; }
    const r = await ops.crearPres(d); if (r.error) { errEn(r.error); return; }
    S.pubOk = r.pres; S.pub = 'ok'; render(); window.scrollTo(0, 0);
  },
  async presCli(){
    const d = leerPres(), e = validarPres(d); if (e) { errEn(e); return; }
    d.clienteId = S.user.id; d.codigo = '';
    const r = await ops.crearPres(d); if (r.error) { errEn(r.error); return; }
    cerrar(); toast(`Pedido ${nPres(r.pres)} enviado. Te respondemos pronto.`); render();
  },
  async cotizar(f){
    const p = pres(f.dataset.id); if (!p || !['pendiente','cotizado'].includes(p.estado)) return;
    const m = parseMonto($('#q-monto').value); if (!(m > 0)) { errEn('Cargá el precio base.'); return; }
    const r = await ops.cotizar(p.id, m, $('#q-nota').value.trim()); if (r.error) { errEn(r.error); return; }
    cerrar(); toast('Cotización guardada'); render();
  },
  async cliente(f){
    const id = f.dataset.id, c = id ? usr(id) : null;
    const nombre = $('#k-n').value.trim(), tel = $('#k-t').value.trim(), usuario = $('#k-u').value.trim().toLowerCase(), pass = $('#k-p').value, ug = $('#k-g').value || null;
    if (nombre.length < 2) return errEn('Escribí el nombre del cliente.');
    if (!c) {
      if (!/^[a-z0-9._-]{3,}$/.test(usuario)) return errEn('El usuario necesita 3 letras o números como mínimo, sin espacios.');
      if (pass.length < MINPASS) return errEn(`La contraseña necesita ${MINPASS} caracteres como mínimo.`);
    } else if (pass && pass.length < MINPASS) return errEn(`La contraseña necesita ${MINPASS} caracteres como mínimo.`);
    const r = await ops.guardarCliente({ id:id || null, nombre, telefono:tel, usuario, pass, unidadId:ug });
    if (r.error) { errEn(r.error); return; }
    cerrar(); toast(c ? 'Cliente guardado' : `Cliente creado. Su código es ${r.codigo}.`); render();
  },
  async unidad(f){
    const id = f.dataset.id, nombre = $('#g-n').value.trim(), sede = $('#g-s').value.trim(), m2 = Number(String($('#g-m').value).replace(',', '.'));
    if (!nombre) return errEn('Escribí el nombre o número.');
    if (!sede) return errEn('Escribí el depósito.');
    if (!(m2 > 0)) return errEn('Escribí la superficie en m².');
    const r = await ops.guardarUnidad({ id:id || null, nombre, sede, m2 }); if (r.error) { errEn(r.error); return; }
    cerrar(); toast('Guardamueble guardado'); render();
  },
  async cfgDesc(){
    const a = entero($('#c-ref').value, 0, 100), b = entero($('#c-rid').value, 0, 100), t = entero($('#c-top').value, 0, 100);
    if (a === null || b === null || t === null) return errEn('Usá números enteros entre 0 y 100.');
    const r = await ops.guardarConfig({ descReferente:a, descReferido:b, tope:t }); if (r.error) { errEn(r.error); return; }
    toast('Descuentos guardados'); render();
  },
  async cfgTurnos(){
    const cupo = entero($('#a-cupo').value, 1, 50), hs = entero($('#a-hs').value, 0, 72), ant = entero($('#a-ant').value, 1, 90);
    if (cupo === null) return errEn('El cupo es un número entre 1 y 50.');
    if (hs === null) return errEn('Las horas de cancelación van de 0 a 72.');
    if (ant === null) return errEn('Los días de anticipación van de 1 a 90.');
    const fr = $('#a-fr').value.split(/[,\s;]+/).filter(Boolean).map(s => { const m = s.match(/^(\d{1,2}):(\d{2})$/); return m && +m[1] < 24 && +m[2] < 60 ? pad(+m[1]) + ':' + m[2] : null; });
    if (!fr.length || fr.includes(null)) return errEn('Los horarios van en formato 24 hs, por ejemplo 09:00, 10:30.');
    const dias = $$('input[name="dia"]:checked').map(i => +i.value);
    if (!dias.length) return errEn('Elegí al menos un día de atención.');
    const r = await ops.guardarConfig({ cupo, horasCancelar:hs, diasAnticipo:ant, franjas:[...new Set(fr)].sort(), dias }); if (r.error) { errEn(r.error); return; }
    toast('Turnos guardados'); render();
  },
  async cfgContacto(){
    const w = $('#a-wa').value.trim(); if (w && digits(w).length < 8) { toast('Escribí un número válido o dejalo vacío.'); return; }
    const r = await ops.guardarConfig({ whatsapp:w }); if (r.error) { errEn(r.error); return; }
    toast('Contacto guardado'); render();
  },
  async cfgPass(){      // dueño, desde Ajustes
    const r = await ops.cambiarClave($('#a-p0').value, $('#a-p1').value); if (r.error) return errEn(r.error, 'm-err2');
    $('#a-p0').value = ''; $('#a-p1').value = ''; toast('Contraseña cambiada');
  },
  async miClave(){      // cliente, desde Mi cuenta
    const r = await ops.cambiarClave($('#mc-p0').value, $('#mc-p1').value); if (r.error) return errEn(r.error);
    cerrar(); toast('Contraseña cambiada');
  },
  async eliminarCuenta(){
    const r = await ops.eliminarMiCuenta($('#mc-del').value); if (r.error) return errEn(r.error);
    S.user = null; DB = NUBE ? baseVacia() : DB; cerrar(); render(); window.scrollTo(0, 0);
    if (NUBE) cargarPublico().then(() => { if (!S.user) render(); });
    toast('Tu cuenta se eliminó. ¡Gracias por haber usado PG Logística!');
  }
};
document.addEventListener('submit', async e => {
  e.preventDefault();
  const n = e.target.dataset.form, h = FORMS[n]; if (!h) return;
  if (SOLO_DUENO_F.has(n) && !esDueno()) return;
  if (n === 'cfgPass' && !esDueno()) return;
  if (['miClave','eliminarCuenta'].includes(n) && (!S.user || esDueno())) return;
  await corre(() => h(e.target));
});

/* ---------- arranque ---------- */
(async function init(){
  const t = ls.get(KT); if (t) aplicarTema(t);
  if (NUBE) {
    DB = baseVacia();
    $('#app').innerHTML = '<div class="boot" role="status">Cargando…</div>';
    const r = await ops.restaurar();
    if (r && r.rol) S.view = r.rol === 'dueno' ? 'resumen' : 'inicio';
    else { const ok = await ops.cargarPublico(); if (r && r.error) toast(r.error); else if (!ok) toast('No hay conexión. Revisá tu internet.'); }
  } else {
    DB = load();
    if (!DB) { DB = await crearBase(true); save(); }
    const u = await ops.restaurar(); if (u) S.view = u.rol === 'dueno' ? 'resumen' : 'inicio';
  }
  render();
})();
})();
</script>
